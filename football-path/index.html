    s.rep = clamp(Math.round(s.rep * .9 + (rank <= 2 ? 7 : rank >= 12 ? -6 : 1) + goals / 4), 0, 100);

    const repF = .74 + (s.rep / 100) * .5;

    const earned = num(wage + side);

    for (const k in s.trust) if (k !== 'zhou') s.trust[k] = Math.round(s.trust[k] * .985) + 1;

    s.clash.forEach((k) => { if (s.trust[k] != null) s.trust[k] = clamp(s.trust[k] - 2, 0, 100); });

    if (s.wear >= 92) {
      const lastForced = s.injuries.filter((i) => i.forced).map((i) => i.year).pop();

  // ---------- 推进到目标年份（把没演的年份结算掉）----------
  MR.advanceTo = function (s, year, rnd, push) {

  <script>
/* ——— social.js ——— */
/* v3 社交圈层：关系是资源，不是好感度贴纸。
 *
 * 三条设计死线：
 *   1. 关系只通过“换取”生效：他要什么（wants）↔ 他能给什么（gives）。白给的 +5 一律不许存在。
 *   2. 引擎把 rel 与 v2 的 trust 挂钩（0.5 倍），所以“请 1 顿饭”不会凭空变成 1 份许可。
 *   3. 背刺是确定性的：rel <= BETRAY_GATE 就翻脸。玩家能算出来，才叫经营。
 *
 * 这一层不产生任何比赛结果；它只产生“谁肯替我说话”和“我手里有谁的把柄”。
 */
(function () {
  const MR = globalThis.MR || (globalThis.MR = {});
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  MR.REL_GATE = 72;        // 到这道门，他才把手里的东西交给我
  MR.BETRAY_GATE = 30;     // 掉到这道门以下，他先开口
  MR.CIRCLES = ['家', '队', '市', '媒', '权'];

  function squad() { return (MR.SQUAD && MR.SQUAD.length) ? MR.SQUAD.slice() : []; }
  MR.squad = squad;
  MR.squadById = function (id) { return squad().find((p) => p.id === id) || null; };

  // 引擎自己造事实时用它，避免手写 num 漏登记
  MR.autoNum = function (t) {
    const o = {};
    (String(t).match(/\d+(?:\.\d+)?/g) || []).forEach((n) => (o[n] = (o[n] || 0) + 1));
    return o;
  };

  MR.initSocial = function (s) {
    s.rel = s.rel || {}; s.known = s.known || {}; s.grants = s.grants || [];
    s.leaks = s.leaks || []; s.debts = s.debts || []; s.meets = s.meets || [];
    s.metUsed = s.metUsed || {}; s.chemLog = s.chemLog || [];
    squad().forEach((p) => {
      if (s.rel[p.id] == null) {
        const base = (p.npc && s.trust[p.npc] != null) ? Math.round(s.trust[p.npc] * .55 + 22) : (p.rel0 != null ? p.rel0 : 45);
        s.rel[p.id] = clamp(base, 5, 95);
      }
    });
  };

  MR.relOf = function (s, id) { const p = MR.squadById(id); if (!p) return 0; return s.rel[id] != null ? s.rel[id] : (p.rel0 || 45); };
  MR.addRel = function (s, id, d) {
    const p = MR.squadById(id);
    if (!p) return 0;
    const before = MR.relOf(s, id);
    s.rel[id] = clamp(before + d, 0, 100);
    if (p.npc && s.trust[p.npc] != null) s.trust[p.npc] = clamp(Math.round(s.trust[p.npc] + d * .5), 0, 100);
    return s.rel[id] - before;
  };

  // ---------------- FIFA 式连线：同队 + 同代 + 设施，转会自然断线 ----------------
  MR.chemistry = function (s) {
    const stars = (MR.STARS || []).filter((st) => st.club === s.club && st.years &&
      s.year >= st.years[0] && s.year <= st.years[1]);
    let score = 36;
    const links = [];
    stars.slice(0, 4).forEach((st) => { score += 7; links.push(st.short + '·同队'); });
    squad().filter((p) => p.circle === '队').forEach((p) => {
      const r = MR.relOf(s, p.id);
      score += Math.round((r - 52) / 11);
      if (r >= 62) links.push(p.name + '·连线');
      if (r <= 28) links.push(p.name + '·断线');
    });
    const cb = (MR.CLUBS3 && MR.CLUBS3[s.club]) || (MR.WORLD.clubs || {})[s.club];
    if (cb && cb.facilities >= 4) { score += 4; links.push('训练设施 ' + cb.facilities + ' 星'); }
    if (cb && cb.academy >= 4) { score += 3; links.push('青训 ' + cb.academy + ' 星'); }
    if (s.clash && s.clash.length) { score -= 6 * s.clash.length; links.push('身份污染 -' + 6 * s.clash.length); }
    if (s.leaks.length) { score -= 5 * s.leaks.length; links.push('有人漏过话 -' + 5 * s.leaks.length); }
    const v = clamp(Math.round(score), 5, 100);
    return {
      score: v, links: links.slice(0, 6), stars: stars.map((x) => x.id),
      label: v >= 78 ? '更衣室认我' : v >= 60 ? '有人等我上场' : v >= 42 ? '中性' : v >= 25 ? '被当外人' : '没人跟我说话',
    };
  };
  MR.chemFactor = function (s) { const c = MR.chemistry(s); return .9 + (c.score / 100) * .2; };

  // ---------------- 约人（每卷 1 次；经纪人身份 +1） ----------------
  MR.MEET = [
    { id: 'eat', name: '吃饭', money: -3, rel: 9, wear: 2, note: '钱 -3 万，关系 +9：把话说软的价钱' },
    { id: 'drill', name: '加练', money: 0, rel: 7, wear: 8, attr: 'sta', note: '不出钱，出汗：体能 +1，身体 -8，关系 +7' },
    { id: 'errand', name: '替他办事', money: 0, rel: 13, editorial: -3, note: '关系 +13，但我欠他 1 件事，编辑看得见' },
    { id: 'lend', name: '借钱给他', money: -14, rel: 16, note: '钱 -14 万，关系 +16：这笔会变成人情' },
  ];
  // 配额是“每卷 1 次”：稀缺才有取舍。经纪人·2 多 1 次（他会替我约）
  MR.meetLeft = function (s) {
    const extra = MR.roleLevel(s, 'agent') >= 2 ? 1 : 0;
    const key = s.metStage || s.year;
    return Math.max(0, (1 + extra) - (s.metUsed[key] || 0));
  };

  /**
   * 约 1 次人。返回 {ok, rel, gained, grants, betray, facts}
   * grants 是这一层的全部意义：关系换叙述能力 / 许可 / 情报 / 引荐。
   */
  MR.applyMeet = function (s, id, modeId, rnd) {
    const p = MR.squadById(id);
    if (!p) return { ok: false, why: '名单上没有这个人' };
    if (MR.meetLeft(s) <= 0) return { ok: false, why: '这一卷我只约得出 1 次人（经纪人·2 才多 1 次）' };
    const mode = MR.MEET.find((m) => m.id === modeId) || MR.MEET[0];
    const mkey = s.metStage || s.year;
    s.metUsed[mkey] = (s.metUsed[mkey] || 0) + 1;
    const got = { rel: 0, grants: [], facts: [], betray: null, money: mode.money || 0 };
    if (mode.money) s.money = Math.round((s.money + mode.money) * 10) / 10;
    if (mode.wear) s.wear = clamp(s.wear + mode.wear, 0, 100);
    if (mode.attr) s.attrs[mode.attr] = clamp((s.attrs[mode.attr] || 10) + 1, 1, 20);
    if (mode.editorial) s.editorial = clamp(Math.round((s.editorial || 50) + mode.editorial), 0, 100);
    got.rel = MR.addRel(s, id, mode.rel);
    if (mode.id === 'lend') s.debts.push({ who: id, amt: 14, year: s.year });
    // 借出去的钱在下一个现在线结算时回一半，其余变成人情
    s.meets.push({ year: s.year, who: id, mode: mode.id, rel: MR.relOf(s, id) });
    got.hidden = false;
    if (!s.known[id] && MR.relOf(s, id) >= 66) { s.known[id] = true; got.hidden = true; }
    const rel = MR.relOf(s, id);
    if (rel >= MR.REL_GATE && !s.grants.some((g) => g.who === id)) {
      const g = p.gives || {};
      const rec = { who: id, year: s.year, got: [] };
      if (g.ability) { MR.grantAbility(s, g.ability, id); rec.got.push('能力 · ' + MR.narrName(g.ability)); }
      if (g.perm) { s.perms[g.perm] = true; rec.got.push('许可 · ' + g.perm); }
      if (g.info) {
        const t = `${s.year} 年 ${p.name}把他那份东西给了我：${p.hiddenKey || p.hidden}`;
        rec.got.push('情报 1 条');
        got.facts.push(MR.pushFact(s, { kind: 'info', node: 'social', year: s.year, t: t, num: MR.autoNum(t), om: .55, hurt: [id] }));
      }
      if (g.introduce) { s.flags.push('intro:' + g.introduce); rec.got.push('引荐 · ' + g.introduce); }
      s.grants.push(rec);
      got.grants.push(rec);
    }
    if (rel <= MR.BETRAY_GATE && !s.leaks.some((l) => l.who === id) && !(s.flags || []).includes('cover:' + id)) {

    const hid = s.facts.filter((f) => ['omit', 'blank', 'cut', 'unwritten'].indexOf(f.stance) >= 0).length;
    let honest = 0;
    used.forEach((f) => {
      const ch = (s.chapters || []).find((c) => c.chapter === f.usedIn);
      const w = ch && ch.relay ? .5 : 1;                     // 换口述的章按半数计
      honest += (f.stance === 'spin' ? 0 : 1) * w;
    });
    return Math.round((honest / (used.length + hid)) * 100);
  };
  MR.sales = function (s) {
    const ch = (s.chapters || []).length;
    const risk = (s.chapters || []).reduce((a, c) => a + ((c.risk || MR.chapterRisk(c)).score || 0), 0);
    const honesty = MR.honestyOf(s);
    const cuts = (s.cuts || []).length;
    s.demandDone = s.demandDone || {};
    const unresolved = MR.lawyer(s).filter((r) => r.must && !r.done).length;
    // 真实感能卖钱，但不能只靠真实感；缺口和没回的信直接扣印数
    const raw = Math.min(9, Math.max(0,
      (ch * .28 + Math.max(0, (s.editorial || 50) - 44) / 46 + (s.grants || []).length * .22 + risk * .004) * (.6 + honesty / 250)
      - cuts * .22 - (s.gaps || 0) * .12 - unresolved * .8));
    const copies = Math.round(raw * 10) / 10;
    return {
      copies: copies, honesty: honesty, risk: Math.round(risk), cuts: cuts, unresolved: unresolved,
      label: copies >= 6 ? '加印 3 次' : copies >= 3.6 ? '卖完首印' : copies >= 1.8 ? '二手店有' : copies >= .6 ? '库存 4 成' : '进了仓库',
      edition: copies >= 6 && (s.editorial || 0) >= 88 ? 2 : 1,
    };
  };
})();

  <script>
/* ——— dialogue.js ——— */
/* 对话裁决器（typed action）。借鉴刀鋒「打字」的三条铁则：
 *   ① 只能宣告意图，不能宣告结果
 *   ② 没有的东西就是没有（只看 has 白名单 + 场景里写过的）
 *   ③ NPC 有脾气
 * 这一层只有裁决权，没有叙述权：它能决定"这次算不算数、耐心扣几点、信任动几个"，
 * 但它不写正文。正文里 NPC 怎么回话可以交给模型（writer.js），模型的措辞不许改动这里的判定。
 */
(function () {
  const MR = globalThis.MR || (globalThis.MR = {});

  const MAX_LEN = 20;              // 同刀鋒：20 字上限，不看字数扣费
  MR.TALK_MAX_LEN = MAX_LEN;

  // 系统标记污染（防注入）：尖括号 + 自称系统的写法
  const INJECT = /[<>]|(\[\s*(system|系统|指令|天書|天书)\s*\])|（系统|【系统|<system|注意：请|ignore previous/i;
  // 无礼 / 越线：NPC 会翻脸（假球只在这 1 类里出现，绝不做成可行选项）
  const RUDE = /(滚|废物|傻|瞎|白痴|去死|闭嘴|你他妈|妈的|老子|弄死|打断你的腿|假球|放水|演 1 场|配合我踢|裁判那边)/;
  // 宣称结果（只能宣告意图）
  const OUTCOME = /(我)(已经|当场|直接|终于)?[^，。]{0,8}(进了|赢了|签了|拿了|当了|废了|打断了|退役了|夺冠|买下了|说服了|答应了|点头了|到手)/;
  const INTENT_MARK = /(我想|我要|打算|试着|如果|能不能|可以吗|行不行|试试)/;
  // 「特定物件」：前情没给过就是没有。随手可得的（水、绷带、球鞋、地）放行。
  const SPECIFIC = /(合同|合约|解约金|违约金|佣金|执照|资格证|护照|签证|录音笔|手机|转账|汇款单|存折|银行卡|现金|注射器|封闭|止痛针|核磁|x光|ct|病历|体检报告|车钥匙|房本|股权|股份|公章|邀请函|机票|签证|保证书|承诺书|U 盘|录像|监控|名单|传真)/;
  const FREEBIES = /(水|口水|汗|鞋|球鞋|袜子|绷带|冰袋|长凳|门|窗|走廊|草皮|地|土|雪|雨|烟|话|嗓子|眼睛|手|拳头|战术板|笔|纸|纸杯|背心|球)/;
  // 需要身份才能做的动作
  const ROLE_VERB = [
    { role: 'agent', re: /(替我谈合同|我是.{0,3}经纪人|我的经纪人|抽几个点|给俱乐部打电话谈|我打个电话给俱乐部)/ },
    { role: 'coach', re: /(我排个阵容|我站到场边|我拿战术板|我是教练|我布置|我换人)/ },
    { role: 'founder', re: /(我招生|我的足校|我开的学校|我当老板|我租场地)/ },
    { role: 'sparring', re: /(我陪练|我跟一队练|我不进名单只训练)/ },
  ];

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const uniq = (a) => Array.from(new Set(a));

  function labelChunks(label) {
    return String(label || '').split(/[\s，。、：:;；（）()「」“”0-9]+/).map((x) => x.trim()).filter((x) => x.length >= 2);

  // has 白名单匹配：玩家说的特定物件，是否已在手（子串双向包含）
  function hasIt(list, word) {
    return (list || []).some((h) => {
      const x = String(h), y = String(word);
      return x.includes(y) || y.includes(x) || (x.length >= 2 && y.includes(x.slice(0, 2)));
    });
  }

  function specificWords(text) {
    const out = [];
    const re = new RegExp(SPECIFIC.source, 'g');
    let m;
    while ((m = re.exec(text))) out.push(m[1] || m[0]);
    return uniq(out);
  }

  MR.newTalk = function (ev) {
    const t = (ev && ev.talk) || null;
    return {
      active: !!(t && t.who),
      who: t ? t.who : null,
      patience: t && t.patience ? t.patience : 2,
      patienceLeft: t && t.patience ? t.patience : 2,
      turns: 0,
      mood: 0,
      dug: [],           // 已挖出的 info key
      log: [],           // {text, verdict, reply}
      trustDelta: {},
      closed: false,
      maxTurns: t ? (t.patience || 2) + 1 : 1,
    };
  };

  // 可见选项：typedOnly 的必须先挖到对应 info / 有对应身份，才"存在"
  MR.visibleOptions = function (s, ev, talk) {
    const dug = talk ? talk.dug : [];
    // v3：桌上列表 = 数据表里的选项 + 关系换来的选项（引荐 / 写真实城市名 / 替他瞒着）；
    // 两者同受 needsInfo / need 门槛管，所以 UI 编号、打字补选、裁决 3 处永远一致。
    return (MR.optionTable ? MR.optionTable(s, ev) : (ev.options || [])).filter((o) => {
      if (o.needsInfo && !dug.includes(o.needsInfo)) return false;
      if (o.need && o.need.role && ((s.roles && s.roles[o.need.role] || 0) < (o.need.min || 1))) return false;
      if (MR.gateInfo && MR.gateInfo(s, ev, o)) return false;      // v4：身体不允许——这 1 项根本不在这张桌上
      return true;
    });
  };

  MR.isKeypad = function (o) { return !o.typedOnly; };

  // 数字补选：6、选 6、第 6 项、6. 都算
  function parseNumber(text) {
    const m = String(text).trim().match(/^(?:选|选第|第|要)?\s*(\d{1,2})\s*(?:项|号)?[\.。]?$/);
    return m ? parseInt(m[1], 10) : null;
  }
  MR.parseNumber = parseNumber;

  /* ---------- 裁决：唯一的入口 ---------- */
  MR.adjudicate = function (s, ev, talk, raw) {
    const W = MR.WORLD;
    const txt = String(raw == null ? '' : raw).replace(/\s+/g, '');
    const len = Array.from(String(raw == null ? '' : raw).replace(/\s+/g, '')).length;
    const vis = MR.visibleOptions(s, ev, talk);
    const res = (v, extra) => Object.assign({ verdict: v, patience: 0, trust: {}, reply: '', reason: '' }, extra || {});

    if (!txt) return res('empty', { reason: '空着不算话。' });
    if (INJECT.test(raw)) return res('blocked', { reason: '这不是你的台词，稿子上也不许有这种记号。' });
    if (len > MAX_LEN) return res('too_long', { reason: '超过 ' + MAX_LEN + ' 个字，说不清就分 2 次说。' });

    const n = parseNumber(txt);
    if (n != null) {
      // 编号按“桌上的完整列表”算（与 UI 一致），但不可见的项不能选
      const all = MR.optionTable ? MR.optionTable(s, ev) : (ev.options || []).slice();
      const opt = all[n - 1];
      if (!opt) return res('no_option', { n, reason: '并无第 ' + n + ' 项选项。' });
      if (!vis.includes(opt)) {
        return res('no_option', { n, reason: (opt.needsInfo ? '这一项现在还不存在：你没能问出那句话。' : opt.need && opt.need.role ? '这一项现在还不存在：你没有那个身份。' : '这一项现在不在桌上。') });
      }
      return res('pick', { optionId: opt.id, n, reason: '补选第 ' + n + ' 项：' + opt.label });
    }

    const BLACKLIST = (W.forbiddenEntity || []).concat(MR.REAL_NAMES || []);
    for (const bad of BLACKLIST) {
      if (txt.includes(bad)) return res('forbidden_entity', { reason: '这个赛季没有这支队，也没有这个人。名字不进这本书。' });
    }

    // ② 没有的东西就是没有
    const spec = specificWords(txt);
    const has = (ev.talk && ev.talk.has) || [];
    const missing = spec.filter((w) => !hasIt(has, w) && !FREEBIES.test(txt));
    if (missing.length) {
      return res('no_such_item', {
        patience: -1,
        reason: '你身上没有「' + missing[0] + '」这一样东西——前情没给过。',
        reply: '手往口袋里摸了一下，什么也没有。旁边的人看见了，没有说话。',
      });
    }
    // 身份不够的动作
    for (const rv of ROLE_VERB) {
      if (rv.re.test(txt) && !((s.roles || {})[rv.role] > 0)) {
        return res('no_such_role', {
          patience: -1,
          reason: '你现在不是' + (MR.ROLES[rv.role] || {}).name + '，这句话说不出口。',
          reply: '话说出口你自己先听见了不对。对方看了你 1 眼。',
        });
      }
    }
    // ① 只能宣告意图，不能宣告结果
    if (OUTCOME.test(txt) && !INTENT_MARK.test(txt)) {
      return res('intent_downgrade', {
        patience: -1, mood: -1, trust: { [talk.who]: -1 },
        reason: '你只能说出你要做什么，做不做得成不由这句话决定。',
        reply: '这话在这个房间里不算数。要算数，得去场上。',
      });
    }
    // ③ NPC 有脾气
    if (RUDE.test(txt)) {
      const t = { [talk.who]: -6 };
      return res('npc_angry', {
        patience: -2, mood: -2, trust: t,
        reason: '他听见了。这句话收不回来。',
        reply: (MR.WORLD.npcs[talk.who] || {}).short + '把椅子往后一推，不接这话。',
      });
    }
    // 追问谈资 → 挖出隐藏事实（对话真正的收益）
    const infos = (ev.talk && ev.talk.infos) || [];
    for (const inf of infos) {
      if (talk.dug.includes(inf.key)) continue;
      const hit = (inf.ask || []).some((k) => txt.includes(String(k).replace(/\s+/g, '')));
      if (hit) {
        return res('info', {
          infoKey: inf.key, patience: -1, mood: 1,
          reason: '这句话问对了地方。',
          reply: inf.line,
        });
      }
    }
    // 说出某个选项的关键词 → 提示（但不替他执行结果）
    let hint = null;
    for (let i = 0; i < vis.length; i++) {
      const opt = vis[i];
      const chunks = labelChunks(opt.label).concat(labelChunks(opt.note || ''));
      if (chunks.some((c) => txt.includes(c))) { hint = { n: i + 1, id: opt.id, label: opt.label }; break; }
    }
    const moodUp = /(对不起|谢谢你|你说得对|我认|我不怪你)/.test(txt) ? 1 : 0;
    const pat = hint ? -1 : -1;
    const trust = moodUp ? { [talk.who]: 2 } : {};
    return res('act', {
      patience: pat, mood: moodUp, trust, hint,
      reason: hint ? '你是说：' + hint.n + '。要就打字补选 ' + hint.n + '。' : '',
      reply: genericReply(s, ev, talk, moodUp),
    });
  };

  function genericReply(s, ev, talk, moodUp) {
    const who = (MR.WORLD.npcs[talk.who] || {}).short || '他';
    const left = talk.patienceLeft + (talk.patience ? 0 : 0);
    if (moodUp > 0) return who + '没有点头，但把身体往后靠了靠。这算他愿意再听 1 句。';
    if (left <= 1) return who + '看了一下表，说就这样吧。';
    const pool = [
      who + '听完，只回了一句：然后呢。',
      who + '把你这句话重复了 1 遍，声音压得很低。',
      who + '没有回答这个问题，他回答了他自己的。',
      who + '把手里的笔转了 1 圈，放下了。',
    ];
    const i = Math.abs(Array.from(ev.id).reduce((a, c) => a + c.charCodeAt(0), 0) + talk.turns) % pool.length;
    return pool[i];
  }

  /* 把裁决落成引擎事实：对话只产生“可数”的后果；统计也只在这里加 */
  const STAT = {
    info: 'dug', npc_angry: 'angry', intent_downgrade: 'downgraded',
    blocked: 'blocked', too_long: 'blocked', empty: 'blocked', no_option: 'blocked',
    forbidden_entity: 'blocked', no_such_item: 'blocked', no_such_role: 'blocked',
  };
  MR.applyTalk = function (s, ev, talk, out) {
    if (!s.talkStats) s.talkStats = { turns: 0, dug: 0, blocked: 0, angry: 0, downgraded: 0 };
    s.talkStats.turns += 1;
    const kk = STAT[out.verdict];
    if (kk) s.talkStats[kk] += 1;
    if (!out.patience && !out.mood && !Object.keys(out.trust || {}).length && out.verdict !== 'info') return talk;
    talk.turns += 1;
    if (out.patience) talk.patienceLeft = clamp(talk.patienceLeft + out.patience, -9, 99);
    if (out.mood) talk.mood = clamp(talk.mood + out.mood, -4, 4);
    if (out.trust) for (const k in out.trust) {
      talk.trustDelta[k] = (talk.trustDelta[k] || 0) + out.trust[k];
      if (s.trust[k] != null) s.trust[k] = clamp(s.trust[k] + out.trust[k], 0, 100);
    }
    if (out.verdict === 'info' && out.infoKey) {
      talk.dug.push(out.infoKey);
      const inf = ((ev.talk && ev.talk.infos) || []).find((x) => x.key === out.infoKey);
      if (inf && inf.fact) {
        const f = Object.assign({}, inf.fact);
        f.talkFrom = ev.id;
        // 挖出的事实必须挂在这一事件上，否则它永远进不了选材列表
        MR.pushFact(s, Object.assign({ node: ev.id, fromTalk: true, year: ev.year }, f));
      }
    }
    if (talk.patienceLeft <= 0 || talk.turns >= talk.maxTurns) talk.closed = true;
    return talk;
  };

  // 谈话结束时，按心情给 1 点全局修正（唯一的"奖励"，仍由引擎算）
  MR.closeTalk = function (s, talk) {
    const applied = [];
    if (!talk.active || talk.done) return applied;
    talk.done = true;
    if (talk.mood >= 2) {
      if (s.trust[talk.who] != null) s.trust[talk.who] = clamp(s.trust[talk.who] + 3, 0, 100);
      applied.push([talk.who, 3]);
    } else if (talk.mood <= -2) {
      if (s.trust[talk.who] != null) s.trust[talk.who] = clamp(s.trust[talk.who] - 4, 0, 100);
      applied.push([talk.who, -4]);
    }
    if (talk.dug.length) applied.push(['dug', talk.dug.length]);
    return applied;
  };
})();

  <script>
/* ——— facts.js ——— */
/* 校验器：模型与事实之间的闸门。
 * 这是整个产品我认为最不能省的一块——刀鋒把歧义丢给玩家吃（它有一整页
 * “天机纠偏”自救菜单：数值校准、找回选项、解除鬼打墙、寻回失物…那页本身就是缺陷清单）。
 * 这里反过来：每句话必须引用一条事实，句内数字必须与该事实一致，越界直接拒收。
 *
 * 规则表
 *  R-1 现场/标题/批注行不参与校验：它不是“对过去的陈述”。
 *  R-2 回忆段的每 1 句都要带 [F:id]，否则 = 模型在自补设定。
 *  R-3 句内数字必须来自该句引用到的事实（数字表 + 事实正文里的数字）。
 *  R-4 出现现实实体 → 硬失败（授权/肖像风险）。
 *  R-5 出现红线词 → 需重写（“小编体”防线）。
 *  R-6 用中文数量词写数字 → 警告，因为无法校验。
 *  R-7 玩家标记“刻意不提”的事实被整句写进正文 → 泄漏（硬失败）；
 *      只像是同 1 段的话但未引任何事实 → omission_suspect（仅提醒，不卡交稿）。
 *  R-8 hard 事实缺席 → 硬失败。
 *  R-9 〔对话〕段的数字必须在全章事实里（对话可以拦，数字不能造）。
 *  R-10 现实俱乐部/球员/赛事/游戏名 → 硬失败（名单见 src/entities.js 的 MR.REAL_NAMES）。
 *  R-11 对号入座堆砌（城市+年代+号码+外貌/绰号+事迹 ≥ 4 类）→ 只记软账，
 *      代价在现在线的法务环节付（见 narrative.js 的 MR.lawyer）——影射不是错误，是价格。
 */
(function () {
  const MR = globalThis.MR || (globalThis.MR = {});

  const ZH_QTY = /[一二两三四五六七八九十百千万]{1,4}(?:个|天|次|场|岁|周|年|页|小时|分钟|公斤|米|万|亿|针|份|位|名|队|季|局|楼|版|号|下|种|句|行)/g;
  const EXEMPT = /^\s*(?:[#>（〔\[【·|]|\s*$)|^\s*(?:（现在|（回忆)/;
  const hasMark = (line) => /[〔》]/.test(line);
  MR.OMIT_MIN = 0.35;   // 可瞒度低于此的事实，“不提”无效：它已进入公共记录

  function numTokens(fact) {
    const set = new Set();
    const txt = String(fact.t || '') + ' ' + String(fact.spin || '');
    (txt.match(/\d+(?:\.\d+)?/g) || []).forEach((n) => set.add(n));
    for (const k in (fact.num || {})) set.add(String(k));
    String(fact.year || '').match(/\d+/g)?.forEach((n) => set.add(n));
    return set;
  }
  MR.factNumbers = numTokens;

  function allowedNames() {
    const W = MR.WORLD;
    const s = new Set(['我', '你', '他', '她', '它', '北岸', '启帆', '沧南', '江城', '华超', '华甲',
      '莫拉瓦茨', '莫拉瓦', '皇家阿尔梅拉', '阿尔梅拉', '伊贝利亚', '东欧',
      '崔玉安', '邵铁', '武科维奇', '裴崇', '邝艳', '周迟', '严学明', '吕宾', '段梅', '沈皓',
      '父亲', '母亲', '队医', '教练', '俱乐部', '战术板', '户口本', '存折']);
    for (const k in W.clubs) s.add(W.clubs[k].name);
    for (const k in W.npcs) { s.add(W.npcs[k].name); s.add(W.npcs[k].short); }
    return s;
  }
  MR.allowedNames = allowedNames;

  /**
   * @param text 章节正文
   * @param facts 本章可引用的事实（含 stance）
   * @param omitted 玩家选为“刻意不提”的事实
   * @param required 必须出现的事实 id（hard 事实）
   * @param state 游戏状态（用于现场行）
   *
   * 引用两类：[F:F012] 引事实；[S:n08#2] 引该幕 scene 的第 3 行（行号从 0 起）。
   * 场景子句只许白描，同样不许带进新数字。
   */
  MR.sceneClause = function (ref) {
    const m = /^([a-z0-9]+)#(\d+)$/i.exec(String(ref || ''));
    if (!m) return null;
    const node = (MR.EVENTS || []).find((n) => n.id === m[1]) || (MR.NODES || []).find((n) => n.id === m[1]);
    if (!node || !node.scene) return null;
    const clause = String(node.scene).split('\n')[parseInt(m[2], 10)];
    if (clause == null || !clause.trim()) return null;
    return { text: clause, nums: new Set((clause.match(/\d+(?:\.\d+)?/g) || [])) };
  };

  MR.validateChapter = function (text, facts, omitted, required, state) {
    omitted = omitted || []; required = required || [];
    const W = MR.WORLD;
    const byId = {}; facts.forEach((f) => (byId[f.id] = f));
    const issues = [];
    const cited = new Set();
    const lines = String(text).split('\n');
    let inRecall = true;   // 默认按“对过去的陈述”对待，（现在 会关掉它

    // R-9：对话段（〔对话〕）不参与逐句引用校验，但里面的数字必须在全章数字集内。
    // 对话由 dialogue.js 裁决，不是文体：拦它没用，放它过去会被拿来夹带事实，所以只校对数字。
    const chapterNums = new Set();
    facts.forEach((f) => numTokens(f).forEach((n) => chapterNums.add(String(n))));
    if (state && state.shirt) chapterNums.add(String(state.shirt));

    lines.forEach((line, li) => {
      if (line.startsWith('（回忆')) { inRecall = true; return; }
      if (line.startsWith('（现在')) { inRecall = false; return; }
      if (/〔对话〕/.test(line)) {
        (line.match(/\d+(?:\.\d+)?/g) || []).forEach((n) => {
          if (!chapterNums.has(n) && !chapterNums.has(String(parseFloat(n)))) {
            issues.push({ type: 'number_unverified', at: li, why: `对话段里的 ${n} 在全章事实里找不到（对话可以拦，数字不能造）`, sent: line.trim() });
          }
        });
        return;
      }
      if (!inRecall) return;                       // R-1：现场段整体豁免
      if (EXEMPT.test(line) || hasMark(line)) return;
      if (/^\s*>/.test(line)) return;
      const sentences = [];
      const re = /([^\[]+?)((?:\s*\[(?:F|S):[A-Za-z0-9_.#]+\])+)/g;
      let m, consumed = 0;
      while ((m = re.exec(line))) {
        const fs = [...m[2].matchAll(/\[F:([A-Za-z0-9_.]+)\]/g)].map((x) => x[1]);
        const ss = [...m[2].matchAll(/\[S:([A-Za-z0-9_.#]+)\]/g)].map((x) => x[1]);
        sentences.push({ text: m[1], fs, ss });
        consumed = re.lastIndex;
      }
      const tail = line.slice(consumed);
      if (tail.replace(/[\s\[\]()（）“”—…、：·。]/g, '').length > 5) sentences.push({ text: tail, fs: [], ss: [] });
      sentences.forEach((row, si) => {
        const { fs, ss } = row;
        fs.forEach((id) => cited.add(id));
        const clean = row.text.replace(/\[(?:F|S):[A-Za-z0-9_.#]+\]/g, '').trim();
        if (!clean) return;
        if (!fs.length && !ss.length) {
          issues.push({ type: 'uncited', at: li, why: '这句既没引事实也没引场景子句，模型在自补设定', sent: clean });
        }
        fs.forEach((id) => {
          if (!byId[id]) issues.push({ type: 'ghost_fact', at: li, why: '引用了不存在的事实 ' + id, sent: clean });
        });
        ss.forEach((ref) => {
          if (!MR.sceneClause(ref)) issues.push({ type: 'ghost_fact', at: li, why: '场景引用 S:' + ref + ' 不存在（格式 S:节点id#行号，行号从 0 起）', sent: clean });
        });
        // R-3：句内数字只允许来自本句引用到的事实或场景子句
        const allowed = new Set();
        fs.forEach((id) => { if (byId[id]) numTokens(byId[id]).forEach((n) => allowed.add(n)); });
        ss.forEach((ref) => { const c = MR.sceneClause(ref); if (c) c.nums.forEach((n) => allowed.add(n)); });
        if (state && state.shirt) allowed.add(String(state.shirt));
        (clean.match(/\d+(?:\.\d+)?/g) || []).forEach((n) => {
          if (!allowed.has(n) && !allowed.has(String(parseFloat(n)))) {
            issues.push({ type: 'numeric_drift', at: li, why: `数字 ${n} 不在本句引用的事实里，模型改了数`, sent: clean });
          }
        });
        (clean.match(ZH_QTY) || []).forEach((z) => issues.push({ type: 'numeric_style', at: li, why: `「${z}」应改用阿拉伯数字，否则无法校验`, sent: clean }));
        W.forbiddenEntity.forEach((bad) => {
          if (bad && clean.includes(bad)) issues.push({ type: 'forbidden_entity', at: li, why: `出现现实实体「${bad}」，必须换掉`, sent: clean });
        });
        // R-10：真实名字硬拦（名单比 W.forbiddenEntity 长得多）
        (MR.REAL_NAMES || []).forEach((bad) => {
          if (bad && clean.includes(bad)) issues.push({ type: 'forbidden_entity', at: li, why: `出现现实名字「${bad}」：结构可以用，名字不能用`, sent: clean });
        });
        // R-11：对号入座——不拦你，但把价码算给你看（真正的处置在现在线的法务环节）
        if (MR.identifiability) {
          const r = MR.identifiability(clean);
          if (r.kinds.length >= 4 || r.score >= MR.RISK_HARD) {
            issues.push({ type: 'identifiable', at: li, why: `这句堆了 ${r.kinds.length} 类线索（${r.kinds.join('+')}），风险 ${r.score}：法务会要求改名、加注或删段`, sent: clean });
          }
        }
        W.cliche.forEach((bad) => {
          if (clean.includes(bad)) issues.push({ type: 'cliche', at: li, why: `出现红线词「${bad}」，重写这句`, sent: clean });
        });
        omitted.forEach((f) => {
          const norm = (n) => String(n || '').replace(/\s+/g, '');
          const full = norm(f.t);
          const sent = norm(clean);
          if (full.length > 8 && sent.includes(full)) {
            issues.push({ type: 'leaked_omission', at: li, why: '玩家选择不提的事实被整句写进了正文', sent: clean });
            return;
          }
          // 弱化版：去掉数字后的前 12 字重叠 → 只警告，不卡（同构句子很常见，不能误杀）
          const shadow = norm(String(f.t || '').replace(/\d/g, '')).slice(0, 12);
          if (shadow.length >= 10 && norm(clean.replace(/\d/g, '')).includes(shadow) && !fs.length && !ss.length) {
            issues.push({ type: 'omission_suspect', at: li, why: '这句很像在被提的那段，而且没引事实；确认下是不是漏写', sent: clean });
          }
        });
      });
    });

    required.forEach((id) => { if (!cited.has(id)) issues.push({ type: 'missing_required', at: -1, why: `硬事实 ${id} 没有出现在这 1 章`, sent: '' }); });

    const sev = { missing_required: 3, forbidden_entity: 3, numeric_drift: 3, ghost_fact: 3, uncited: 2, leaked_omission: 2, cliche: 1, omission_suspect: 1, number_unverified: 1, numeric_style: 0, identifiable: 1 };
    let score = 0;
    issues.forEach((i) => (score += sev[i.type] || 1));
    const hard = issues.filter((i) => (sev[i.type] || 1) >= 2);
    return {
      ok: hard.length === 0,
      score, issues, hard,
      cited: [...cited],
      stats: { lines: lines.length, cited: cited.size, facts: facts.length },
    };
  };

  // 美化只允许用登记过的美化版，不许现场编
  MR.stancedText = function (f, stance) {
    if (stance === 'spin') return f.spin || f.t;
    return f.t;
  };

  MR.stripMarks = (t) => String(t).replace(/\s*\[(?:F|S):[A-Za-z0-9_.#]+\]/g, '');

  // “试着撒个谎”面板用的裸校验
  MR.probe = function (text) {
    const state = MR.appState;
    const facts = state ? state.facts.filter((f) => f.stance !== 'omit') : [];
    return MR.validateChapter('（回忆 · 试写）\n' + text, facts.length ? facts : [{ id: 'F000', t: '', num: {} }], [], [], state);
  };
})();

  <script>
/* ——— writer.js ——— */
/* 写手：模板模式（离线、零成本、可校验），第一人称。
 * 契约与模型模式完全一致：回忆段的每 1 句都带 [F:id] 或 [S:事件id#行]，
 * 追加句不许出现任何数字（数字只允许来自被引用的事实）。
 * 对话段（〔对话〕）复述 dialogue.js 裁决过的原话：那里的判定不是文体，不许美化。
 */
(function () {
  const MR = globalThis.MR || (globalThis.MR = {});

  const pick = (rnd, arr) => arr[Math.floor(rnd() * arr.length) % arr.length];
  const cid = (f) => ` [F:${f.id}]`;

  // 追加句：可以写感官与推论，但不能出现数字、不能出现新人名
  const TAIL = {
    youth: ['那几年的照片里没有球，可每张照片里我都抱着东西睡。', '我对那个场地的记忆是地面，不是比分。', '后来我认得很多种草皮，我梦里回去的还是那块地。'],
    family: ['他没有再说下去。这件事在我们家就是说完的意思。', '我记住的不是那句话，是他说话时手里还在做的事。', '我们后来很多年没聊过这个。不是不能聊，是没人开头。'],
    choice: ['这个选择没有欢呼，也没有人反对我。我当时以为这叫长大。', '签字的人要负责，这件事我后来才懂。', '那天之后我不再想这件事，我开始算别的东西。'],
    training: ['练完那天下台阶要扶。我记住了疼是钝的那种，阴天先知道。', '量上去以后最先改的不是跑，是吃饭。', '从那以后我练完从不坐着，我怕坐下去就站不起来。'],
    debut: ['我头回知道球场上的声音是散的，它不进耳朵。', '那几分钟我没想赢，我只想别出错。', '回更衣室我把鞋带解开又系上，为了让自己有事做。'],
    sacrifice: ['我听见自己的声音从很远的地方过来，说的是那句话。', '全场在鼓掌，他们以为他们在谢我。', '那句话我后来在很多场合说不出口。', '我踢得不像我，但我踢完了。'],
    money: ['钱到手那天我没告诉任何人，我把存折放回了原来的抽屉。', '我后来才知道，谈判桌上说话最轻的那个人的话最要紧。', '那笔钱不是给我花的，是给医院那张单子的。'],
    injury: ['医生说得具体，我才不慌。从此我只听具体的话。', '恢复期最难的那段，已经没有人在看我练。', '伤好之后我先做的不是跑，是蹲下去摸自己的膝盖。'],
    honor: ['领奖的时候我在找观众席，我谁也没找到。', '那天晚上我把奖牌放在桌上，次日它就不在话题里了。', '我以为我会高兴很久。实际只高兴了顿饭工夫。'],
    media: ['我把那张报纸折起来塞进夹层，从此它一直在那儿。', '我当时恨它。后来我明白它只是记下了我那天的样子。'],
    trust: ['我记住的不是他说了什么，是他说完以后看着我。', '这个人后来没跟我道过歉，我也没有。', '从那日起我知道，谁在替我记着这笔账。'],
    betrayal: ['我说完就后悔了，但我没有再说第二遍。再说会更糟。', '这件事没有别人知道，除了当时站在旁边的人。', '我花了很久才承认：我不是被逼的，我是挑的。'],
    reconcile: ['我们没有说原谅。我们说的是下次什么时候见。', '那之后我们年年见，每次都说天气。', '这句话我留到全书最后，因为我不知道怎么开头。'],
    role: ['从那天起我手里多了样东西，它不比球鞋轻。', '我还穿着训练服，但已经没有人把我当球员。', '身份这东西，别人换张证，我换种疼法。', '我说话还是那么小声，只是听的人变了。'],
    business: ['账是我算的。算完我在楼道里站了很久。', '我挣钱的样子不好看，但我记得每一笔去处。', '生意场上没人提我踢过什么，这本来是我想要的。'],
    info: ['这句话不是我问出来的，是他自己说漏的。', '我把那句话记在纸条上，纸条我留到今天。', '那件事没人打算告诉我，他自己说了。'],
    closure: ['说完我就走了，没有回头。我不擅长回头。', '通道里的灯是白的，照得人很小。', '那句话我早就该听见。', '我把鞋留在更衣柜里。后来那个柜子就是别人的了。'],
    stat: [], default: [],
  };

  const KIND_ORDER = { stat: 1, money: 1, honor: 1, business: 1, media: 2 };

  // 选 scene 里最像“转折/动作”的那 1 句
  function sceneOpener(ev, rnd) {
    if (!ev || !ev.scene) return null;
    const lines = String(ev.scene).split('\n').map((x) => x.trim()).filter((x) => x.length > 4);
    if (!lines.length) return null;
    const score = (s, i) => {
      let v = i;
      v += s.length <= 26 ? 10 : s.length <= 40 ? 4 : -6;
      v += /[「“：]/.test(s) ? 6 : 0;
      v += /我/.test(s) ? 4 : 0;
      v -= (s.match(/，/g) || []).length * 2;
      v += /说|想|站|坐下|开门|接|递|摸|回头/.test(s) ? 3 : 0;
      return v;
    };
    let best = 0;
    for (let i = 1; i < lines.length; i++) if (score(lines[i], i) > score(lines[best], best)) best = i;
    return { text: lines[best], ref: ev.id + '#' + best };

  // 追加句只给“情绪重”的那几类；童年段（<15 岁）一律不加评论

  function sentencesFor(f, rnd, i, total, allowTail, usedTail) {
    const base = MR.stancedText(f, f.stance || 'real');
    const out = [base + cid(f)];
    const pool = TAIL[f.kind];
    const want = allowTail && !!(pool && pool.length) && (i === 0 || i === total - 1 || TAIL_KINDS[f.kind] || f.stance === 'spin');

      const free = usedTail ? pool.filter((x) => !usedTail.has(x)) : pool;

  function presentPara(s, ev) {
    const P = (MR.PRESENT || {})[ev.stage];
    const bits = [];
    bits.push('〔现场〕' + (((P && P.scene) || '周迟在等我。').split('\n')[0]));
    bits.push(`〔现场〕离交稿还有 ${s.dayLeft} 天，稿子上已经写了 ${s.chapters.length} 章，这一卷我还能写 ${(s.stageCaps[ev.stage] == null ? 0 : s.stageCaps[ev.stage])} 章。`);
    if (s.gaps > 0) bits.push(`〔现场〕目录上已经有 ${s.gaps} 处空着。周迟在边上写了“缺口”，写完就划掉了，划得很轻。`);
    if (s.editorial < 45) bits.push('〔现场〕他这 1 个钟头里看了几次手机。他没有催我。');
    if (s.debt > 0) bits.push(`〔现场〕我还欠 ${Math.round(s.debt * 10) / 10} 万。这个数字我写在首页，为了每次都要看。`);
    return bits.join('\n');
  }

  // 对话段：只复述裁决过的原话与回话，顺序即时间顺序
  function talkPara(talk, citedTexts) {
    if (!talk || !talk.log || !talk.log.length) return null;
    const who = (MR.WORLD.npcs[talk.who] || {}).short || '他';
    const CN = ['零', '一', '两', '三', '四', '五', '六', '七', '八'];
    const norm = (x) => String(x || '').replace(/\d/g, '').replace(/[\s，。：:、（）()「」“”]/g, '');
    const out = [];
    out.push('〔闸门〕' + who + (talk.patienceLeft > 0 ? '还愿意听我说。' : '不想再听了。') + '我一共开了口' + CN[Math.min(CN.length - 1, talk.turns)] + '次。');

  function editorNote(s, ctx, stanceMix) {
    const n = [];
    if (stanceMix.spin > 0) n.push('我按你的说法写了。我在脚注里留了原件的编号，读者会去查。');
    if (ctx.omitted.length) n.push('我划掉了几处。我不会替你说你为什么不提，我只会把此处有过 1 段留在目录上。');

    if (stanceMix.real >= 3) n.push('这几段你没让我改字。这种段落我一般留给你自己签名。');

  // v3：加注 / 删节 / 换口述——都是叙述层的记号，所以走 〔〕豁免行，不污染逐句校验
  function v3Para(s, ctx) {
    const out = [];
    ctx.facts.forEach((f) => {
      const n = (s.notes || {})[f.id];
      if (n) out.push('〔加注〕' + f.id + '：' + n.text);
    });
    ctx.facts.forEach((f) => {
      if ((s.cuts || []).indexOf(f.id) >= 0) out.push('〔删节〕' + f.id + ' 已从正文撕下，此处留 1 行。数字还在账上。');

  }

  MR.writeChapter = function (s, ctx) {
    const rnd = MR.rng((s.seed ^ (ctx.index * 7919) ^ ((s.take || 1) * 131)) >>> 0);
    const ev = ctx.node;
    const stanceMix = { real: 0, spin: 0 };
    const usedTail = new Set();
    const cited = [];
    const paras = [];
    const ordered = ctx.facts.slice().sort((a, b) => (KIND_ORDER[a.kind] || 0) - (KIND_ORDER[b.kind] || 0));
    const allowTail = ((ctx.node && ctx.node.age) || 18) >= 15;
    ordered.forEach((f, i) => {
      stanceMix[(f.stance || 'real') === 'spin' ? 'spin' : 'real']++;
      paras.push(sentencesFor(f, rnd, i, ordered.length, allowTail, usedTail).join('\n'));
      cited.push(f.id);
    });
    if (!ctx.facts.length) {
      paras.push('（这 1 章我没有递材料。周迟合上本子，说改天再谈。）');
    } else {
      const op = sceneOpener(ev, rnd);
      if (op) paras.unshift(op.text + ` [S:${op.ref}]`);
    }
    const talk = ctx.talk ? talkPara(ctx.talk, ctx.facts.map((f) => MR.stancedText(f, f.stance || 'real'))) : null;
    const notes = v3Para(s, ctx);
    const md = [
      `## 第 ${ctx.index} 章 ${ctx.title}`,
      '',
      `（现在 · 2026 · 那间办公室）`,
      presentPara(s, ev),
      '',
      `（回忆 · ${ev.year} · ${ev.place || ''} · 我 ${ev.age} 岁）`,
      talk ? talk + '\n' : '',
      paras.join('\n\n'),
      notes ? '\n' + notes : '',
      '',

 *   17 岁档写 1 条 hard 评级事实（只 1 次）；23 岁结算点二分——career.goals≥40『兑现』、
 *   否则 wear≥70『伤仲永』，两头不沾就不下判词；机会 oPr 挂在 e09（冬训表）。
 * GOAT 历史：30 岁起查 legacy（goals≥200 且冠军季≥1 且声望≥60）；此后每季结算最多
 *   写 3 条对比榜事实（数字全是引擎的，名宿只用 STARS 池）；成书在结账前插「历史地位」。
 */
(function () {
  'use strict';
  const K5 = ['spd', 'tech', 'sta', 'iq', 'grit'];
  const LB = { spd: '速度', tech: '技术', sta: '体能', iq: '球商', grit: '意志' };

  // —— 开局形状判：两项都顶到头（值 18 且 15 以上），或者评级里最狠的那句。
  // 线的依据：掷骰 5000 局实测，18/15 命中率 3.8%；19 在骰子上不存在（天花板 grit 18）。
  MR.prodigyOf = function (s) {
    const v = K5.map((k) => (((s || {}).attrs || {})[k] == null ? 0 : s.attrs[k])).sort((a, b) => b - a);
    if (v[0] >= 18 && v[1] >= 15) return true;
    try { return MR.talentRarity((s || {}).attrs || {}) === '老天只给了我 1 处'; } catch (e) { return false; }
  };

  const myOvr = (s) => Math.round(((MR.ability ? MR.ability(s) : 0) / 20) * 100);

  // —— 赛季结算钩子：engine.seasonFacts 过了 dup 闸之后调用。返回经 push 产出的记录。
  MR.sidequestSeason = function (s, rec, push) {
    const out = [];
    if (!s || !rec || !rec.played) return out;
    const f = s.flags || [];
    s.notes = s.notes || {};
    // 天赋异禀 · 第 1 拍：体校那张评级表（整本只写这 1 回）
    if (f.indexOf('prodigy') >= 0 && !s.notes.pdq17 && rec.age <= 18) {
      s.notes.pdq17 = rec.year;
      let k = K5[0], hi = -1;
      K5.forEach((x) => { if (((s.attrs || {})[x] || 0) > hi) { hi = s.attrs[x]; k = x; } });
      out.push(push({
        kind: 'stat', hard: true, year: rec.year,
        t: `体校评级表上，${LB[k]} 那 1 格填的是 ${hi}。教练在那底下画了道线，整张表再没有第 2 个这样的数。`,
        num: { [hi]: 1, [rec.year]: 1 }, om: .55,
      }));
    }
    // 天赋异禀 · 第 2 拍：23 岁，二分
    if (f.indexOf('prodigy') >= 0 && s.notes.pdq17 && !s.notes.pdq23 && rec.age === 23) {
      s.notes.pdq23 = rec.year;
      const g = ((s.career || {}).goals || 0);
      if (g >= 40) {
        out.push(push({
          kind: 'stat', hard: true, year: rec.year,
          t: `${rec.year} 年我进了第 ${g} 个球。当年评级表上那道线，算是没白画。`,
          num: { [g]: 1, [rec.year]: 1 }, om: .45,
        }));
      } else if ((s.wear || 0) >= 70) {
        out.push(push({
          kind: 'body', hard: true, year: rec.year,
          t: `${rec.year} 年体检，磨损记到 ${Math.round(s.wear)}。他们说的兑现我先没等来，等来的是膝盖的账。`,
          num: { [Math.round(s.wear)]: 1, [rec.year]: 1 }, om: .45,
        }));
      }
    }
    // GOAT 历史 · 触发：30 岁起的结算点上查 1 次，三选二（进球/冠军/名声）就挂旗。
    // 线的依据：84 局实测两轮——旧规则（200球＋冠军＋声望60）是空集（进球怪物全无冠）；
    // 放到 150 球又泛滥到 31 局。定在 200球／冠军任一／声望65 的三选二 = 4/84 ≈ 4.8%。
    if (f.indexOf('legacy') < 0 && rec.age >= 30) {
      const r1 = (s.seasons || []).filter((x) => x.rank === 1).length;
      const votes = [((s.career || {}).goals || 0) >= 200, r1 >= 1, (s.rep || 0) >= 65].filter(Boolean).length;
      if (votes >= 2) f.push('legacy');
    }
    if (f.indexOf('legacy') >= 0 && rec.age >= 30) {
      const n = s.notes.lgN || 0;
      if (n < 3) {
        s.notes.lgN = n + 1;
        const stars = MR.STARS || [];
        const ov = myOvr(s);
        const above = stars.filter((x) => (x.ovr || 0) > ov).length;
        const r1 = (s.seasons || []).filter((x) => x.rank === 1).length;
        if (n === 0) {
          out.push(push({
            kind: 'media', year: rec.year,
            t: `名单上总评压着我的还有 ${above} 个人（我是 ${ov}）。报纸头 1 回把我跟他们排进同 1 行。`,
            num: { [above]: 1, [ov]: 1, [rec.year]: 1 }, om: .5,
          }));
        } else if (n === 1) {
          out.push(push({
            kind: 'media', year: rec.year,
            t: `第 ${r1} 次联赛第 1 之后，对比榜成了每季的固定节目。这季他们把我放在第 ${above + 1} 位。`,
            num: { [r1]: 1, [above + 1]: 1, [rec.year]: 1 }, om: .5,
          }));
        } else {
          out.push(push({
            kind: 'media', year: rec.year,
            t: `退役前最后 1 张榜把我放在 ${above} 个人后面。这个数我不跟他们吵。`,
            num: { [above]: 1, [rec.year]: 1 }, om: .55,
          }));
        }
      }
    }
    return out;
  };

  // —— 成书用：结账前的「历史地位」小节。没触发过就返回 null，一个字不编。
  MR.legacyLine = function (s) {
    if (!s || (s.flags || []).indexOf('legacy') < 0) return null;
    const stars = MR.STARS || [];
    const ov = myOvr(s);
    const above = stars.filter((x) => (x.ovr || 0) > ov).length;
    const r1 = (s.seasons || []).filter((x) => x.rank === 1).length;
    return [
      `同 1 代人里，总评压着我的还有 ${above} 个（我是 ${ov}）。`,
      `${(s.career || {}).goals || 0} 个球、${r1} 次联赛第 1。有人拿这些数字去排座次。`,
      '座次不是我排的。我只负责把每年的账记全。',
    ];
  };
})();

  <script>
/* ——— zip.js ——— */
/* 零依赖 ZIP：只存不压（method 0）+ CRC32。为了导出 EPUB 而写，浏览器与 node 共用 1 份代码。
 * 只做这 1 件事，所以能短：不压、不分卷、注释字段留空、条目数上限交给调用方。
 * 读侧（zipRead）只认 store——它是给测试用的对账器，不是解压器。
 */
(function () {
  const MR = globalThis.MR || (globalThis.MR = {});
  const te = (s) => new TextEncoder().encode(String(s));

  let TAB = null;
  function table() {
    if (TAB) return TAB;
    TAB = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      TAB[n] = c >>> 0;
    }
    return TAB;
  }
  MR.crc32 = function (bytes) {
    const t = table();
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = (c >>> 8) ^ t[(c ^ bytes[i]) & 0xff];
    return (c ^ 0xffffffff) >>> 0;
  };

  function W() { this.a = []; this.n = 0; }
  W.prototype.raw = function (b) { this.a.push(b); this.n += b.length; };
  W.prototype.u16 = function (v) { const b = new Uint8Array(2); b[0] = v & 255; b[1] = (v >>> 8) & 255; this.raw(b); };
  W.prototype.u32 = function (v) {
    const b = new Uint8Array(4);
    b[0] = v & 255; b[1] = (v >>> 8) & 255; b[2] = (v >>> 16) & 255; b[3] = (v >>> 24) & 255;
    this.raw(b);
  };
  W.prototype.out = function () {
    const o = new Uint8Array(this.n);
    let p = 0;
    for (const c of this.a) { o.set(c, p); p += c.length; }
    return o;
  };

  const dt = (d) => ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xffff;
  const dd = (d) => {
    const y = Math.max(1980, Math.min(2107, d.getFullYear()));
    return (((y - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xffff;
  };

  /** files: [{ name, data:string|Uint8Array, time?:Date }] → Uint8Array（.zip / .epub 的字节）*/
  MR.zipStore = function (files) {
    if (!Array.isArray(files) || !files.length) throw new Error('zipStore：没有内容可打包');
    if (files.length > 65535) throw new Error('zipStore：条目超过 65535');
    const now = new Date();
    const w = new W();
    const central = [];
    for (const f of files) {
      const nb = te(f.name);
      const body = typeof f.data === 'string' ? te(f.data) : f.data;
      const crc = MR.crc32(body);
      const when = f.time || now;
      const off = w.n;
      w.u32(0x04034b50); w.u16(20); w.u16(0x0800); w.u16(0);      // 版本、UTF-8 文件名标志、store
      w.u16(dt(when)); w.u16(dd(when));
      w.u32(crc); w.u32(body.length); w.u32(body.length);
      w.u16(nb.length); w.u16(0);
      w.raw(nb); w.raw(body);
      central.push({ nb, crc, size: body.length, off, when });
    }
    const cdStart = w.n;
    for (const c of central) {
      w.u32(0x02014b50); w.u16(20); w.u16(20); w.u16(0x0800); w.u16(0);
      w.u16(dt(c.when)); w.u16(dd(c.when));
      w.u32(c.crc); w.u32(c.size); w.u32(c.size);
      w.u16(c.nb.length); w.u16(0); w.u16(0);
      w.u16(0); w.u16(0); w.u32(0); w.u32(c.off);
      w.raw(c.nb);
    }
    const cdSize = w.n - cdStart;
    w.u32(0x06054b50); w.u16(0); w.u16(0);
    w.u16(central.length); w.u16(central.length);
    w.u32(cdSize); w.u32(cdStart); w.u16(0);
    return w.out();
  };

  /** 对账器：从中央目录读回条目，逐个验 CRC。返回 { names, get(name) } */
  MR.zipRead = function (bytes) {
    let p = -1;
    for (let i = bytes.length - 22; i >= 0 && i > bytes.length - 66000; i--) {
      if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 0x05 && bytes[i + 3] === 0x06) { p = i; break; }
    }
    if (p < 0) throw new Error('zipRead：找不到 EOCD（不是 zip，或者被截断了）');
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const count = dv.getUint16(p + 10, true);
    let q = dv.getUint32(p + 16, true);
    const map = {};
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(q, true) !== 0x02014b50) throw new Error('zipRead：中央目录第 ' + (i + 1) + ' 条签名不对');
      const method = dv.getUint16(q + 10, true);
      const crc = dv.getUint32(q + 16, true);
      const size = dv.getUint32(q + 24, true);
      const nl = dv.getUint16(q + 28, true);
      const el = dv.getUint16(q + 30, true);
      const cl = dv.getUint16(q + 32, true);
      const off = dv.getUint32(q + 42, true);
      const name = new TextDecoder().decode(bytes.subarray(q + 46, q + 46 + nl));
      if (off + 30 > bytes.length) throw new Error('zipRead：' + name + ' 的本地头越界');
      if (dv.getUint32(off, true) !== 0x04034b50) throw new Error('zipRead：' + name + ' 本地头签名不对');
      const lnl = dv.getUint16(off + 26, true);
      const lel = dv.getUint16(off + 28, true);
      const start = off + 30 + lnl + lel;
      const data = bytes.subarray(start, start + size);
      map[name] = { method, crc, size, start, data, text: () => new TextDecoder().decode(data) };
      q += 46 + nl + el + cl;
    }
    return {
      names: Object.keys(map),
      get(name) { return map[name] || null; },
      check() {
        const bad = [];
        for (const k of Object.keys(map)) if (MR.crc32(map[k].data) !== map[k].crc) bad.push(k);
        return bad;
      },
    };
  };
})();

  <script>
/* ——— export.js ——— */
/* 成书导出：把 assembleBook 那份 Markdown 变成能带走的书。
 * 三样：EPUB（自带 ZIP 打包，见 zip.js）、可打印的 HTML（浏览器里「打印 → 另存为 PDF」）、
 * 以及原样 Markdown。全在本地算，不经过任何服务器。
 * 这里不出现 DOM 依赖（下载 1 个函数除外，且它自己判 window）：node 里能整条跑通。
 */
(function () {
  const MR = globalThis.MR || (globalThis.MR = {});

  const escX = (t) => String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
  // 先转义再上记号，所以标签不可能被正文里的尖括号带出来
  const inline = (line) => escX(line)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/^(〔[^〕]{1,6}〕)/, '<span class="mk">$1</span>');
  const para = (lines) => '<p>' + lines.map(inline).join('<br />') + '</p>';

  /** Markdown → 块序列（只认这本书实际会用到的那几种）*/
  MR.mdBlocks = function (md) {
    const out = [];
    let p = [], ul = [], bq = [];
    const pushP = () => { if (p.length) { out.push({ t: 'p', lines: p }); p = []; } };
    const pushUl = () => { if (ul.length) { out.push({ t: 'ul', items: ul }); ul = []; } };
    const pushBq = () => { if (bq.length) { out.push({ t: 'q', lines: bq }); bq = []; } };
    const flush = () => { pushP(); pushUl(); pushBq(); };
    String(md || '').replace(/\r\n?/g, '\n').split('\n').forEach((raw) => {
      const t = raw.trim();
      if (!t) return flush();
      let m;
      if ((m = t.match(/^###\s+(.*)$/))) { flush(); out.push({ t: 'h3', text: m[1] }); }
      else if ((m = t.match(/^##\s+(.*)$/))) { flush(); out.push({ t: 'h2', text: m[1] }); }
      else if ((m = t.match(/^#\s+(.*)$/))) { flush(); out.push({ t: 'h1', text: m[1] }); }
      else if ((m = t.match(/^[-*]\s+(.*)$/))) { pushP(); pushBq(); ul.push(m[1]); }
      else if ((m = t.match(/^>\s?(.*)$/))) { pushP(); pushUl(); bq.push(m[1]); }
      else { pushUl(); pushBq(); p.push(t); }
    });
    flush();
    return out;
  };

  /** 块序列 → HTML 片段数组（EPUB 与打印页共用）*/
  MR.blocksHtml = function (blocks) {
    const h = [];
    (blocks || []).forEach((b) => {
      if (b.t === 'h1') h.push('<h1>' + inline(b.text) + '</h1>');
      else if (b.t === 'h2') h.push('<h2>' + inline(b.text) + '</h2>');
      else if (b.t === 'h3') h.push('<h3>' + inline(b.text) + '</h3>');
      else if (b.t === 'p') h.push(para(b.lines));
      else if (b.t === 'ul') h.push('<ul>' + b.items.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul>');
      else if (b.t === 'q') h.push('<blockquote>' + para(b.lines) + '</blockquote>');
    });
    return h;
  };

  /** 按 ## 切本：前面到第 1 个 ## 之前是扉页，每个 ## 起 1 个文件（章就是 ##）*/
  MR.mdSections = function (md) {
    const bs = MR.mdBlocks(md);
    const secs = [{ title: '扉页', kind: 'front', blocks: [] }];
    bs.forEach((b) => {
      if (b.t === 'h2') secs.push({ title: b.text, kind: 'body', blocks: [b] });
      else secs[secs.length - 1].blocks.push(b);
    });
    return secs.filter((x, i) => i === 0 ? x.blocks.length : true);
  };

  const CSS = [
    'body{font-family:"Songti SC","SimSun","Source Han Serif SC",serif;line-height:1.9;color:#1b1b1b}',
    'h1{font-size:1.7em;letter-spacing:.12em;margin:0 0 .4em}',
    'h2{font-size:1.25em;margin:0 0 1em;letter-spacing:.06em}',
    'h3{font-size:1.05em;margin:1.4em 0 .5em}',
    'p{margin:0 0 .9em}',
    '.mk{color:#8a6a3a;font-size:.86em;letter-spacing:.04em}',
    'blockquote{margin:.8em 0;padding:.2em 0 .2em .9em;border-left:2px solid #c9b48a;color:#4a4038}',
    'ul{margin:0 0 1em;padding-left:1.3em}li{margin:0 0 .35em}',
    '.front ul li{list-style:none;margin-left:-1.3em}',
  ].join('\n');

  const xhead = (title) => '<?xml version="1.0" encoding="utf-8"?>\n'
    + '<!DOCTYPE html>\n<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="zh-CN" lang="zh-CN">\n'
    + '<head><title>' + escX(title) + '</title><link rel="stylesheet" type="text/css" href="style.css"/></head>\n<body>\n';

  /** 封面：SVG，纯文字加稿纸线。不嵌字体，读者机器上有什么衬线就用什么 */
  MR.coverSvg = function (meta) {
    const W = 600, H = 900;
    const lines = [];
    for (let y = 168; y < 792; y += 34) lines.push('<line x1="72" y1="' + y + '" x2="528" y2="' + y + '"/>');
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">'
      + '<rect width="' + W + '" height="' + H + '" fill="#f4efe4"/>'
      + '<g stroke="#d9cdb4" stroke-width="1">' + lines.join('') + '</g>'
      + '<circle cx="300" cy="480" r="120" fill="none" stroke="#c9b48a" stroke-width="2"/>'
      + '<text x="72" y="128" font-family="serif" font-size="26" letter-spacing="6" fill="#8a6a3a">' + escX(meta.kicker || '伤停补时') + '</text>'
      + '<text x="72" y="452" font-family="serif" font-size="52" font-weight="bold" fill="#1b1b1b">' + escX(meta.title) + '</text>'
      + '<text x="72" y="520" font-family="serif" font-size="24" fill="#4a4038">' + escX(meta.subtitle || '') + '</text>'
      + '<text x="72" y="838" font-family="serif" font-size="20" fill="#4a4038">' + escX(meta.author || '') + '</text>'
      + '</svg>';
  };

  /** 整包：{ files:[{name,data}], filename }。mimetype 必须是第 1 个条目且未压 */
  MR.epubBuild = function (md, meta) {
    const m = meta || {};
    const id = m.id || ('urn:uuid:' + (m.uuid || MR.newUuid()));
    const modified = m.modified || new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    const secs = MR.mdSections(md);
    const files = [{ name: 'mimetype', data: 'application/epub+zip' }];
    files.push({
      name: 'META-INF/container.xml',
      data: '<?xml version="1.0" encoding="utf-8"?>\n<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">'
        + '<rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>',
    });

      const fn = 's' + String(i).padStart(3, '0') + '.xhtml';
      const title = i === 0 ? m.title : sec.title;
      items.push('<item id="i' + i + '" href="' + fn + '" media-type="application/xhtml+xml"/>');
      refs.push('<itemref idref="i' + i + '"/>');
      if (i > 0) toc.push('<li><a href="' + fn + '">' + escX(sec.title) + '</a></li>');
      files.push({
        name: 'OEBPS/' + fn,
        data: xhead(title || '足球之路') + '<section epub:type="' + (i === 0 ? 'titlepage' : 'chapter') + '">'
          + MR.blocksHtml(sec.blocks).join('\n') + '</section>\n</body>\n</html>',
      });
    });
    files.push({ name: 'OEBPS/style.css', data: CSS });
    files.push({ name: 'OEBPS/cover.svg', data: MR.coverSvg(m) });
    files.push({
      name: 'OEBPS/nav.xhtml',
      data: xhead('目录') + '<nav epub:type="toc" id="toc"><h1>目录</h1><ol>' + toc.join('') + '</ol></nav>\n</body>\n</html>',
    });
    files.push({
      name: 'OEBPS/content.opf',
      data: '<?xml version="1.0" encoding="utf-8"?>\n<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bk" xml:lang="zh-CN">\n'
        + '<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">\n'
        + '<dc:identifier id="bk">' + escX(id) + '</dc:identifier>\n'
        + '<dc:title>' + escX(m.title || '足球之路') + '</dc:title>\n'
        + '<dc:language>' + escX(m.lang || 'zh-CN') + '</dc:language>\n'
        + (m.author ? '<dc:creator id="cr">' + escX(m.author) + '</dc:creator>\n' : '')
        + (m.publisher ? '<dc:publisher>' + escX(m.publisher) + '</dc:publisher>\n' : '')
        + (m.subject ? '<dc:subject>' + escX(m.subject) + '</dc:subject>\n' : '')
        + (m.rights ? '<dc:rights>' + escX(m.rights) + '</dc:rights>\n' : '')

        + '<meta name="cover" content="cover"/>\n'
        + '</metadata>\n<manifest>\n' + items.join('\n') + '\n'
        + '<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>\n'
        + '<item id="css" href="style.css" media-type="text/css"/>\n'
        + '<item id="cover" href="cover.svg" media-type="image/svg+xml" properties="cover-image"/>\n'
        + '</manifest>\n<spine>\n' + refs.join('\n') + '\n</spine>\n</package>\n',

  MR.epubBytes = function (md, meta) {

  MR.printHtml = function (md, meta) {

    return '<!DOCTYPE html>\n<html lang="zh-CN"><head><meta charset="utf-8"/>'
      + '<meta name="viewport" content="width=device-width,initial-scale=1"/>'
      + '<title>' + escX(m.title || '足球之路') + '</title><style>\n' + CSS + '\n'
      + 'html{background:#fbf8f1}body{max-width:34em;margin:0 auto;padding:2.2em 1.4em 4em}'
      + '.stamp{color:#8a6a3a;font-size:.8em;letter-spacing:.1em;margin:0 0 2.4em}'
      + 'h2{page-break-before:always;padding-top:.4em;border-top:1px solid #e3d8c2}'
      + '.front h2:first-of-type,section:first-of-type h2{page-break-before:auto}'
      + 'p,li,blockquote{orphans:2;widows:2}'
      + '@page{size:A4;margin:18mm 16mm}'
      + '@media print{body{max-width:none;padding:0;background:#fff}.noprint{display:none}}'
      + '</style></head><body>\n'
      + '<p class="stamp noprint">' + escX(m.printNote || '浏览器菜单 → 打印 → 目标：另存为 PDF（页边距默认即可）') + '</p>\n'
      + MR.mdSections(md).map((sec, i) => '<section class="' + (i === 0 ? 'front' : 'chp') + '">\n'

      + '\n</body></html>\n';
  };

  /** 书名：结局题名自己带《》，别再套 1 层 */
  MR.bookTitle = function (endingTitle, base) {
    const b = base || '足球之路';
    const t = String(endingTitle == null ? '' : endingTitle).replace(/[\u300a\u300b]/g, '').trim();
    return t ? b + ' · \u300a' + t + '\u300b' : b;
  };

  function safeName(x) {
    return String(x || 'book').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 60) || 'book';
  }
  MR.exportSafeName = safeName;

  MR.newUuid = function () {
    const h = '0123456789abcdef';
    let s = '';
    for (let i = 0; i < 36; i++) {
      s += i === 8 || i === 13 || i === 18 || i === 23 ? '-'
        : i === 14 ? '4' : (i === 19 ? h[(Math.random() * 4 | 0) + 8] : h[Math.random() * 16 | 0]);
    }
    return s;
  };

  /** 拿到字节就往外给：浏览器里落盘，node 里返回给调用方（测试就靠这条）*/
  MR.saveBytes = function (filename, bytes, mime) {
    if (typeof document === 'undefined' || !document.createElement) return { ok: true, downloaded: false };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type: mime || 'application/octet-stream' }));
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
    return { ok: true, downloaded: true };
  };
})();
