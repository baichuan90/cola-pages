  <script>/* 封闭版不装 src/prompt.js：可选联网层（云档 / 电视台 / 模型网关） */</script>
  <script>
/* ——— app.js ——— */
/* 状态机：对话 → 决策 → 口径/选材 →（每卷 1 次）现在线结算。
 * UI 与测试脚本共用这 1 层。章节文本来源只有 2 个：模板写手（离线）或远端模型。
 * 两者输出都必须过校验器才允许进书；对话只由 dialogue.js 裁决，模型不能改判定。
 */
(function () {
  const MR = globalThis.MR || (globalThis.MR = {});
  const clamp = (v, lo, hi) => Math.max(lo === undefined ? 0 : lo, Math.min(hi === undefined ? 100 : hi, v));

  // 许可的门：关系没崩的人才会点头（UI 也用这张表提前告诉玩家）
  const PERM_GATE = 60;
  const PERM_OWNER = { medical: 'cui', school: 'yan', clubfile: 'vuko', roster: 'lv', pei: 'pei', kuang: 'kuang' };
  MR.PERM_GATE = PERM_GATE;
  MR.permOwner = function (perm) { return PERM_OWNER[perm] || null; };

  function eventsOf(stage) { return (MR.EVENTS || []).filter((e) => e.stage === stage); }

  MR.createGame = function (opts) {
    opts = opts || {};
    const s = MR.newState(opts.seed || 20260824, opts.edition, opts.alloc);
    s.chapters = [];
    s.evIdx = 0;
    s.phase = 'roll';                 // roll -> talk -> decide -> chapter -> present -> … -> end
    s.talk = null;
    s.pending = { facts: [], omitted: [], selected: [], stances: {} };
    s.rndFn = MR.rng((s.seed + 1) >>> 0);
    const rnd = s.rndFn;
    if (MR.initSocial) MR.initSocial(s);        // v3：关系网
    if (MR.narrInit) MR.narrInit(s);            // v3：叙述权
    const BOOK_YEAR = 2026;                        // 交稿年：硬边界，时间不许越过它
    const push = (f) => MR.pushFact(s, f);

    function cur() { return (MR.EVENTS || [])[s.evIdx]; }
    function stageOf(ev) { return ev ? ev.stage : null; }
    function factsOf(ev) { return ev ? s.facts.filter((f) => f.node === ev.id && !f.usedIn) : []; }
    // 补写的候选：没用过的 + 被章位预算封印的（usedIn='budget'）。
    // 预算封印是「没轮到」，交稿日还剩就能补；自愿留白（'gap'）是「我能写但没写」，那是选择，不回来。
    function unusedOf(ev) { return ev ? s.facts.filter((f) => f.node === ev.id && (!f.usedIn || f.usedIn === 'budget')) : []; }

    // 15 岁前的底牌不进账本；进第 1 个职业卷事件时登记成事实
    function ensureTalentFact() {
      if (s.facts.some((f) => f.talent)) return;
      const ev = cur();
      if (!ev || ev.stage !== 'st3') return;
      const a = s.attrs;
      const line = MR.talentLine ? MR.talentLine(s) : `我 15 岁的底牌：速度 ${a.spd}，技术 ${a.tech}，体能 ${a.sta}，球商 ${a.iq}，意志 ${a.grit}。${a.glass >= 1.5 ? '膝盖比别人脆。' : '身体不算脆。'}`;
      push({
        kind: 'stat', year: ev.year, node: ev.id, talent: true,
        t: line + (a.glass >= 1.5 ? '膝盖比别人脆。' : ''),
        num: Object.assign(MR.autoNum ? MR.autoNum(line) : {}, MR.talentNum ? MR.talentNum(s) : { [a.spd]: 1, [a.tech]: 1, [a.sta]: 1, [a.iq]: 1, [a.grit]: 1 }), om: .05, hard: true,
      });
    }

    function openEvent() {
      const ev = cur();
      if (!ev) { s.phase = 'present'; s.presentStage = lastFinishedStage(); return { done: true }; }
      s.metStage = ev.stage;                       // v3：约人配额按卷计
      s.talk = MR.newTalk(ev);
      ensureTalentFact();
      s.phase = s.talk.active ? 'talk' : 'decide';
      return { event: ev, phase: s.phase };
    }

    function lastFinishedStage() {
      const list = MR.EVENTS || [];
      const ev = list[Math.min(s.evIdx, list.length - 1)];
      if (s.evIdx >= list.length) return list[list.length - 1].stage;
      return (list[s.evIdx - 1] || ev || {}).stage;
    }

    function pendingPresent() {
      const list = MR.EVENTS || [];
      if (s.evIdx === 0 || s.evIdx >= list.length) return false;
      const prev = list[s.evIdx - 1], here = list[s.evIdx];
      return !!(here && prev && prev.stage !== here.stage && MR.PRESENT && MR.PRESENT[prev.stage] && !(s.presentDone || {})[prev.stage]);
    }

    // ---------------- 对话 ----------------
    function talkSay(text) {
      const ev = cur();
      if (!ev) return { ok: false, why: '现在没有人在跟你说话' };
      // 谈话结束后，打字仍然可以补选号码（同按下那 1 键）；自由话已经递不进去了
      if (s.phase === 'decide') {
        const n = MR.parseNumber(String(text == null ? '' : text).replace(/\s+/g, ''));
        if (n == null) return { ok: false, why: '话已经说完了。打字输号码可以补选第 6、7 项。' };
        const out = MR.adjudicate(s, ev, s.talk || MR.newTalk(ev), text);
        if (out.verdict === 'pick') return { ok: true, out, decide: true };
        return { ok: false, out, why: out.reason || '这一项现在不在桌上' };
      }
      if (s.phase !== 'talk' || !s.talk) return { ok: false, why: '现在没有人在跟你说话' };
      if (s.talk.closed) return { ok: false, why: '他已经说完他要说的了' };
      const out = MR.adjudicate(s, ev, s.talk, text);
      const res = { ok: true, out, talk: s.talk };
      if (out.verdict === 'blocked' || out.verdict === 'too_long' || out.verdict === 'empty' || out.verdict === 'no_option' || out.verdict === 'forbidden_entity') {
        MR.applyTalk(s, ev, s.talk, out);           // 只记统计，不扣耐心、不占回合
        s.talk.log.push({ text, verdict: out.verdict, reply: '', reason: out.reason });
        return Object.assign(res, { noConsume: true });
      }
      MR.applyTalk(s, ev, s.talk, out);
      s.talk.log.push({ text, verdict: out.verdict, reply: out.reply, reason: out.reason, hint: out.hint || null });
      s.talkLog.push({ ev: ev.id, text, verdict: out.verdict });
      if (s.talk.closed) res.closed = true;
      return res;
    }

    function endTalk() {
      const ev = cur();
      if (!s.talk) { s.phase = 'decide'; return { ok: true }; }
      const applied = MR.closeTalk(s, s.talk);
      if (ev && s.talk.dug.length) {
        // 挖到的东西本身也是事实：它进账本，玩家可以选择不写
      }
      s.phase = 'decide';
      return { ok: true, applied, mood: s.talk.mood, dug: s.talk.dug.slice() };
    }

    // ---------------- 决策 ----------------
    function choose(optionId) {
      const ev = cur();
      if (!ev) return { ok: false, why: '没有待决的事件' };
      const vis = MR.visibleOptions(s, ev, s.talk);
      // 选了的项如果在桌上但不让选（身份/身体），直接拒——不当那 1 项不存在去静默改选
      const want = (MR.optionTable ? MR.optionTable(s, ev) : (ev.options || [])).find((o) => o.id === optionId);
      if (want && vis.indexOf(want) < 0) {
        const gg = MR.gateInfo ? MR.gateInfo(s, ev, want) : null;
        if (gg) return { ok: false, why: gg.why };
        if (want.need && want.need.role && clampRole(want.need) === false) return { ok: false, why: '你现在没有这个身份，这话轮不到你说' };
        if (want.needsInfo && !(s.talk && s.talk.dug.includes(want.needsInfo))) return { ok: false, why: '那 1 项要先问出来才存在' };
      }
      const opt = vis.find((o) => o.id === optionId) || vis[0];
      if (!opt) return { ok: false, why: '这个选项规定不存在' };
      if (s.phase === 'talk' && s.talk && !s.talk.closed) MR.closeTalk(s, s.talk);
      const need = _needOf(opt);
      if (need && clampRole(need) === false) return { ok: false, why: '你现在没有这个身份，这话轮不到你说' };
      // v4：身体门——这 1 项不是不想选，是这副身体选不了
      if (MR.gateInfo) {
        const g = MR.gateInfo(s, ev, opt);
        if (g) return { ok: false, why: g.why };
      }
      // 把上一站到这一站之间没演的年份结算掉（18 岁以前只长岁数）
      if (ev.year > s.year) {
        MR.advanceTo(s, ev.year, rnd, (f) => push(Object.assign({ node: ev.id, span: true }, f)));
      }
      s.year = Math.max(s.year, ev.year);
      s.age = s.year - s.born;
      if (opt.club) s.club = opt.club;                 // 转会：允许写在选项顶层（数据表里就这么写的）
      MR.applyMods(s, opt.mods, rnd);
      (opt.facts || []).forEach((f, i) => push(Object.assign({ node: ev.id, idx: i, choice: opt.id }, f)));
      // v3：这一选项规定是不是在“点名现实”？另外把同时代的人记进账（总评对总评）
      s.pendingExpose = opt.expose ? 1 : opt.blur ? -1 : 0;
      s.pendingMotif = ev.motif || null;
      if (opt.expose) s.expose = (s.expose || 0) + 1;
      if (MR.starFacts) MR.starFacts(s, ev);
      // 该年赛季结算（17 岁以后）。同 1 年两幕：只结 1 次账，不然 1 年会记 2 个赛季。
      let season = null;
      const sameYear = !!(s.seasons.length && s.seasons[s.seasons.length - 1].year === Math.max(s.year, ev.year));
      if (s.age >= 17 && !sameYear) {
        season = MR.simSeason(s, rnd, { injuryRisk: opt.injRisk || 0, growth: growthOf(opt) });
        MR.seasonFacts(s, season, (f) => push(Object.assign({ node: ev.id, span: true }, f)));
        if (season.played) s.year = Math.max(s.year, ev.year + 1);
        s.age = s.year - s.born;
      }
      s.currentChoice = opt.id;
      if (s.year > BOOK_YEAR) s.year = BOOK_YEAR;
      s.age = s.year - s.born;
      // 38 岁以后没人再给合同：退役是通知，不是选择
      if (s.retired == null && s.age >= 38) {
        s.retired = s.year;
        push({ kind: 'closure', node: ev.id, year: s.year, t: `${s.year} 年没人再给我合同。我不踢了——这不是决定，是通知。`, num: { [s.year]: 1, 38: 1 }, om: .1, hard: true });
      }
      s.phase = 'chapter';
      s.pending.facts = factsOf(ev);
      s.pending.stances = {};
      s.pending.facts.forEach((f) => (s.pending.stances[f.id] = f.stance || 'real'));
      s.pending.selected = s.pending.facts.map((f) => f.id);
      return { ok: true, option: opt, season, candidates: s.pending.facts.map(pick2), capLeft: s.stageCaps[stageOf(ev)] };
    }

    function _needOf(opt) { return opt.need && opt.need.role ? opt.need : null; }
    function clampRole(need) { return MR.roleLevel(s, need.role) >= (need.min || 1); }

    // ---------------- 口径 ----------------
    function setStance(id, stance) {
      const f = s.facts.find((x) => x.id === id);
      if (!f) return { ok: false, why: '事实不存在' };
      if (stance === 'omit') {
        if (f.hard) return { ok: false, why: '硬事实可以改口径，不能消失' };
        if ((f.om || 0) < MR.OMIT_MIN) return { ok: false, why: '这条已进入公共记录，不提也拦不住别人提' };
      }
      s.pending.stances[id] = stance;
      s.pending.selected = s.pending.facts.filter((x) => (s.pending.stances[x.id] || 'real') !== 'omit').map((x) => x.id);
      return { ok: true };
    }
    function pick(id, on) { setStance(id, on ? 'real' : 'omit'); return s.pending.selected.length; }

    // ---------------- 成书 ----------------
    async function commitChapter() {
      const isRevisit = s.revisitIdx != null;
      const ev = isRevisit ? (MR.EVENTS[s.revisitIdx]) : cur();
      if (!ev) return { ok: false, why: '没有可交的事件' };
      const stage = ev.stage;
      // 补写不占本卷章数（那扇窗已经关了），它占的是交稿前的 1 天
      if (isRevisit) {
        if (s.dayLeft <= 0) { cancelRevisit(); return { ok: false, why: '交稿日到了，补不了' }; }
      } else if ((s.stageCaps[stage] == null ? 1 : s.stageCaps[stage]) <= 0) {
        cancelRevisit();
        return { ok: false, why: '这一卷的章数已经用完了。剩下的只能留白，或者先回去补写别卷。' };
      }
      // v4：短板与踢法的回响。推在成稿这 1 刻而不是选项目录那 1 刻：否则这 1 句会卡在 1 个被留白的事件里，永远进不了书。
      if (MR.allocBeats && MR.allocBeats(s, ev, null, (f) => push(Object.assign({ node: ev.id, year: ev.year, beat: true }, f)))) {
        s.pending.facts = factsOf(ev);
        s.pending.facts.forEach((f) => { if (!s.pending.stances[f.id]) s.pending.stances[f.id] = f.stance || 'real'; });
        s.pending.selected = s.pending.facts.map((f) => f.id);
      }
      const all = s.pending.facts;
      if (!all.length && s.chapters.some((c) => c.eventId === ev.id)) {
        cancelRevisit();
        return { ok: false, why: '这一章已经交过了' };
      }
      const stanceOf = (f) => s.pending.stances[f.id] || 'real';
      const chosen = all.filter((f) => stanceOf(f) !== 'omit');
      const omitted = all.filter((f) => stanceOf(f) === 'omit');
      chosen.forEach((f) => { f.stance = stanceOf(f); f.usedIn = s.chapters.length + 1; });
      omitted.forEach((f) => { f.stance = 'omit'; f.usedIn = 'gap'; });
      const ctx = {
        node: ev, index: s.chapters.length + 1, title: ev.title, facts: chosen, omitted,
        talk: s.revisitIdx != null ? null : s.talk, evId: ev.id,
        expose: !isRevisit && s.pendingExpose > 0, blur: !isRevisit && s.pendingExpose < 0, motif: isRevisit ? null : (s.pendingMotif || null),
      };
      const required = all.filter((f) => f.hard).map((f) => f.id);
      const res = await MR.produceChapter(s, ctx, required);
      res.chapter = s.chapters.length + 1;
      res.stage = stage;
      res.eventId = ev.id;
      // v3：对号入座风险在这 1 章算完就钉住，以后法务只读这个数
      res.motif = isRevisit ? null : (s.pendingMotif || null);
      res.expose = !isRevisit && s.pendingExpose > 0;
      res.blur = !isRevisit && s.pendingExpose < 0;
      res.notes = {};
      if (MR.chapterRisk) res.risk = MR.chapterRisk(res);
      s.risk = Math.max(s.risk || 0, (res.risk || { score: 0 }).score || 0);
      s.pendingMotif = null; s.pendingExpose = 0;
      s.chapters.push(res);
      if (!isRevisit) s.stageCaps[stage] = Math.max(0, (s.stageCaps[stage] || 0) - 1);
      s.dayLeft = Math.max(0, s.dayLeft - 1);
      if (omitted.length) s.gaps += omitted.length;
      s.editorial = clamp(Math.round(s.trust.zhou * .5 + relation(s) * .2 + (100 - s.gaps * 11) * .15 + (res.validation.ok ? 14 : -10) - driftPenalty(s)));
      hurtPeople(s, chosen, omitted);
      s.revisitIdx = null;
      s.pending = { facts: [], omitted: [], selected: [], stances: {} };
      s.phase = 'review';
      return Object.assign({ ok: true }, res);
    }

    // 整段留白：这 1 事件不写进书（比“不提”更狠，目录上会留 1 行）
    function blank() {
      const ev = s.revisitIdx != null ? (MR.EVENTS[s.revisitIdx]) : cur();
      if (!ev) return { ok: false, why: '没有可留白的事件' };
      const fs = factsOf(ev);
      const capLeft = s.stageCaps[ev.stage] == null ? 1 : s.stageCaps[ev.stage];
      const voluntary = capLeft > 0;              // 本卷还有章数却不写 = 选择；没章数了 = 预算，不算缺陷
      fs.forEach((f) => { f.stance = voluntary ? 'blank' : 'unwritten'; f.usedIn = voluntary ? 'gap' : 'budget'; });
      if (fs.length && voluntary) s.gaps += 1;
      if (!voluntary) s.forced = (s.forced || 0) + 1;
      s.log.push({ t: 'blank', node: ev.id, n: fs.length, voluntary });
      s.pending = { facts: [], omitted: [], selected: [], stances: {} };
      if (s.revisitIdx != null) { s.revisitIdx = null; s.phase = s.revisitReturn || 'present'; if (s.revisitReturn === 'present') s.revisitReturn = null; else if (s.revisitReturn !== 'present') { /* 回当时那张桌子 */ }
        return { ok: true, blanked: fs.length, back: s.phase }; }
      advance();
      return { ok: true, blanked: fs.length };
    }

    function advance() {
      s.evIdx += 1;
      const list = MR.EVENTS || [];
      if (s.evIdx >= list.length) { s.presentStage = list[list.length - 1].stage; s.phase = 'present'; return; }
      const prev = list[s.evIdx - 1], here = list[s.evIdx];
      if (prev.stage !== here.stage && MR.PRESENT && MR.PRESENT[prev.stage] && !(s.presentDone || {})[prev.stage]) {
        s.presentStage = prev.stage; s.phase = 'present'; return;
      }
      openEvent();
    }

    function reviewNext() {
      if (s.phase !== 'review') return { ok: false };
      // 刚写完的是“补写”：回原来那一站，不推进事件
      if (s.revisitReturn) {
        const back = s.revisitReturn;
        s.revisitReturn = null;
        s.pending = { facts: [], omitted: [], selected: [], stances: {} };
        s.phase = back === 'present' ? 'present' : (s.talk && s.talk.active && !s.talk.closed ? 'talk' : 'decide');
        return { ok: true, phase: s.phase, revisit: true };
      }
      s.phase = 'decide';
      advance();
      return { ok: true, phase: s.phase };
    }

    // ---------------- 现在线（每卷 1 次）----------------
    function eventsOfStage() { return MR.EVENTS || []; }
    const PERM_OWNER = { medical: 'cui', shao: 'shao', pei: 'pei', kuang: 'kuang', vuko: 'vuko', zhou: 'zhou', yan: 'yan', lv: 'lv', duan: 'duan', hao: 'hao' };

    function presentStageData() {
      const st = s.presentStage || (MR.EVENTS || [])[Math.max(0, s.evIdx - 1)]?.stage;
      const P = (MR.PRESENT || {})[st] || null;
      if (!P) return null;
      // 把“谁能点头”预先标出来：信任不够就别许诺
      const opts = (P.options || []).map((o) => {
        if (!o.grant || !o.grant.perm) return o;
        const whoId = o.grant.who || MR.permOwner(o.grant.perm);
        return Object.assign({}, o, { gate: whoId ? { who: whoId, need: PERM_GATE, at: Math.round(s.trust[whoId] || 0), ok: (s.trust[whoId] || 0) >= PERM_GATE } : null });
      });
      return Object.assign({}, P, { options: opts });
    }
    function presentChoose(optId) {
      const data = presentStageData();
      const st = s.presentStage;
      if (!data) { finishPresent(); return { ok: true, skipped: true }; }
      const opt = (data.options || []).find((o) => o.id === optId) || (data.options || [])[0];
      if (opt) {
        MR.applyMods(s, opt.mods, rnd);
        if (opt.grant && opt.grant.perm && !s.perms[opt.grant.perm]) {
          const whoId = opt.grant.who || MR.permOwner(opt.grant.perm);
          const who = (MR.WORLD.npcs[whoId] || {}).short || '对方';
          const tn = cur() ? cur().id : (MR.EVENTS[0] || {}).id;
          // 许可不是白给的：谈话里把人翻脸过，他可以不点头
          if (s.permWaiver > 0 && whoId && (s.trust[whoId] || 0) < PERM_GATE) {
            // “换口述”换来的 1 次：不是他点头，是我把那章说成他讲的
            s.permWaiver -= 1;
            s.perms[opt.grant.perm] = true;
            push({ kind: 'trust', node: tn, t: `${who}没点头。我把这 1 章改成他讲的，出版社当作证词收了。`, num: { 1: 1 }, om: .2, hard: true });
          } else if (whoId && s.trust[whoId] != null && s.trust[whoId] < PERM_GATE) {
            push({ kind: 'trust', node: tn, t: `${who}不肯点头。他说：那段我不给你用。`, num: { 1: 1 }, om: .25, hard: true });
            s.log.push({ t: 'perm_denied', who: whoId, trust: s.trust[whoId] });
          } else {
            s.perms[opt.grant.perm] = true;
            push({ kind: 'trust', node: tn, t: `${who}同意我把那 1 段写进书里。`, num: { 1: 1 }, om: .1 });
          }
        }
        const rvs = opt.reveal ? (Array.isArray(opt.reveal) ? opt.reveal : [opt.reveal]) : [];
        rvs.forEach((rv) => {
          const fact = rv.fact || rv;
          const target = rv.toEvent || (cur() ? cur().id : (MR.EVENTS[0] || {}).id);
          push(Object.assign({ node: target, revealed: true, year: (MR.EVENTS.find((e) => e.id === target) || {}).year }, fact));
          s.log.push({ t: 'reveal', text: fact.t, node: target });
        });
      }
      s.presentDone = s.presentDone || {};
      s.presentDone[st] = true;
      if (MR.settleDebts) { const sd = MR.settleDebts(s); if (sd && sd.fact) sd.fact.node = cur() ? cur().id : 'present'; }
      (s.chapters || []).forEach((c) => { if (MR.chapterRisk) c.risk = MR.chapterRisk(c); });
      s.phase = 'decide';
      const list = MR.EVENTS || [];
      if (s.evIdx < list.length) openEvent(); else s.phase = 'end';
      return { ok: true, reveals: (opt && opt.reveal) ? 1 : 0 };
    }
    function finishPresent() {
      s.presentDone = s.presentDone || {};
      s.presentDone[s.presentStage] = true;
      const list = MR.EVENTS || [];
      if (s.evIdx < list.length) openEvent(); else s.phase = 'end';
      return { ok: true };
    }

    // ---------------- 回溯补写 ----------------
    function cancelRevisit() {
      if (s.revisitIdx == null) { s.revisitReturn = null; return; }
      s.revisitIdx = null;
      s.revisitReturn = null;
      s.pending = { facts: [], omitted: [], selected: [], stances: {} };
      s.phase = s.presentDone && s.presentDone[s.presentStage] ? (cur() ? 'decide' : 'end') : 'present';
    }

    function revisitList() {
      const out = [];
      (MR.EVENTS || []).forEach((ev, i) => {
        const fs = unusedOf(ev);
        if (fs.length) out.push({ i, id: ev.id, title: ev.title, year: ev.year, stage: ev.stage, facts: fs.map(pick2), capLeft: s.stageCaps[ev.stage] });
      });
      return out;
    }
    function canRevisit() { return s.dayLeft > 0 && revisitList().length > 0; }
    function revisit(eventId) {
      const list = MR.EVENTS || [];
      let i = -1;
      if (eventId == null) { const r = revisitList(); if (r.length) i = r[r.length - 1].i; }
      else i = list.findIndex((e) => e.id === eventId);
      if (i < 0) return { ok: false, why: '旧段落都写完了，没什么可补的' };
      const ev = list[i];
      const fs = unusedOf(ev);
      if (!fs.length) return { ok: false, why: '那 1 段没有未册的事实' };
      if (s.dayLeft <= 0) return { ok: false, why: '交稿日到了，补不了' };
      s.revisitIdx = i;
      s.revisitReturn = s.phase;
      s.phase = 'chapter';
      s.pending.facts = fs;
      s.pending.stances = {};
      fs.forEach((f) => (s.pending.stances[f.id] = f.stance || 'real'));
      s.pending.selected = fs.map((f) => f.id);
      return { ok: true, event: ev.title, year: ev.year, candidates: fs.map(pick2), capLeft: s.stageCaps[ev.stage] };
    }

    // ---------------- v3：回看（重写已交章节的口径） ----------------
    async function rewriteChapter(chapterNo, stances) {
      const idx = s.chapters.findIndex((c) => c.chapter === chapterNo);
      if (idx < 0) return { ok: false, why: '没有这一章' };
      const ch = s.chapters[idx];
      if (!ch.ctx) return { ok: false, why: '这一章没留底稿，改不了口径（旧存档不背这个锅）' };
      // 次数由“回看”这 1 手付：narrUse('revisit') 已经付过就不要再付 1 次
      if (!s.revisitWanted) {
        const gate = MR.canUse(s, 'revisit');
        if (!gate.ok) return gate;
        const use = MR.use(s, 'revisit', ch.chapter);
        if (!use.ok) return use;
      }
      s.revisitWanted = false;
      const seen = {};
      const all = (ch.ctx.facts || []).concat(ch.ctx.omitted || [])
        .map((f) => s.facts.find((x) => x.id === f.id) || f)          // 存档 round-trip 后要回到真身，不然改了个副本
        .filter((f) => f && f.id && !seen[f.id] && (seen[f.id] = 1));
      all.forEach((f) => {
        const st = (stances || {})[f.id] || f.stance || 'real';
        f.stance = st;
        f.usedIn = st === 'omit' ? 'gap' : ch.chapter;
      });
      const chosen = all.filter((f) => f.stance !== 'omit');
      const omitted = all.filter((f) => f.stance === 'omit');
      const nctx = Object.assign({}, ch.ctx, { facts: chosen, omitted: omitted, index: ch.chapter, title: ch.title });
      const required = all.filter((f) => f.hard).map((f) => f.id);
      const res = await MR.produceChapter(s, nctx, required);
      res.chapter = ch.chapter; res.stage = ch.stage; res.eventId = ch.eventId;
      res.motif = ch.motif || null; res.expose = !!ch.expose; res.blur = !!ch.blur;
      res.notes = ch.notes || {}; res.rewriteOf = ch.chapter; res.rewrites = (ch.rewrites || 0) + 1;
      res.risk = MR.chapterRisk ? MR.chapterRisk(res) : (ch.risk || { score: 0 });
      s.chapters[idx] = res;
      s.gaps = Math.max(0, s.gaps + omitted.length - (ch.omitted || []).length);
      s.editorial = clamp(Math.round(s.trust.zhou * .5 + relation(s) * .2 + (100 - s.gaps * 11) * .15 + (res.validation.ok ? 14 : -10) - driftPenalty(s)));
      return Object.assign({ ok: true, rewrote: ch.chapter, validation: res.validation }, { source: res.source });
    }

    const api = {
      state: s,
      stateOf: () => s,
      event: () => cur(),
      events: MR.EVENTS,
      stages: MR.STAGES,
      summary: () => MR.summary(s),
      start: function (pts) {
        if (pts != null) {
          const r = applyAlloc(pts);
          if (!r.ok) return r;
        }
        s.phase = 'roll'; openEvent(); return { ok: true, api: api };
      },
      allocPoints: function () { return s.alloc || null; },
      applyAlloc,
      rollAlloc: function () { return applyAlloc(MR.randomAlloc ? MR.randomAlloc(s.rndFn) : MR.flatAlloc()); },
      clearAlloc: function () {
        if (s.phase !== 'roll') return { ok: false, why: '已经开局了' };
        s.alloc = null;
        const r0 = s.roll0 || s.attrs;
        (MR.ALLOC ? MR.ALLOC.keys : ['spd', 'tech', 'sta', 'iq', 'grit']).forEach((k) => (s.attrs[k] = r0[k] == null ? s.attrs[k] : r0[k]));
        s.attrs.rarity = MR.talentRarity(s.attrs);
        s.style = null;
        s.style = MR.styleOf ? MR.styleOf(s).id : null;
        return { ok: true };
      },
      confirmTalent: function () { s.phase = 'roll'; openEvent(); return api; },
      curEvent: () => cur(),
      talk: () => s.talk,
      talkSay,
      endTalk,
      visibleOptions: function () {
        const ev = cur();
        if (!ev) return [];
        const all = MR.optionTable ? MR.optionTable(s, ev) : (ev.options || []);
        const vis = MR.visibleOptions(s, ev, s.talk);
        return all.map((o, i) => {
          const thisGate = MR.gateInfo ? MR.gateInfo(s, ev, o) : null;   // v4：身体门
          return {
            n: i + 1, id: o.id, label: o.label, note: o.note || '', typedOnly: !!o.typedOnly,
            gate: thisGate, gateWhy: thisGate ? thisGate.why : '', gateShort: thisGate ? thisGate.short : '',
            fromBuild: o.from === 'build',
            expose: !!o.expose, blur: !!o.blur, from: o.from || null,
            available: vis.includes(o),
            locked: !!(o.need && o.need.role && !clampRole(o.need)) || !!thisGate,
            needsInfo: o.needsInfo || null,
            dug: !!(o.needsInfo && s.talk && s.talk.dug.includes(o.needsInfo)),
          };
        });
      },
      keypad: function () { return api.visibleOptions().filter((o) => o.available && !o.typedOnly); },
      choose,
      pick, setStance,
      candidates: () => s.pending.facts.map(pick2),
      commitChapter, blank,
      reviewNext,
      present: presentStageData,
      presentChoose, finishPresent,
      revisit: revisit, revisitList, canRevisit, cancelRevisit,
      backFromMemoir: function () { const r = s.revisitReturn || 'present'; s.revisitReturn = null; return r; },
      endings: () => computeEndings(s),
      rewriteChapter,
      // v3：社交圈与叙述权（引擎只记账，模型只写法）
      social: () => MR.socialView(s),
      meetLeft: () => MR.meetLeft(s),
      meet: function (who, mode) {
        const ev = cur();
        const r = MR.applyMeet(s, who, mode, rnd);
        if (r.ok && ev && r.facts) r.facts.forEach((f) => { f.node = ev.id; });   // 挂到当前事件，才能在本章被选进正文
        (s.chapters || []).forEach((c) => { if (MR.chapterRisk) c.risk = MR.chapterRisk(c); });
        r.state = MR.summary(s);
        return r;
      },
      narr: () => MR.narrList(s),
      narrUse: function (id, arg, extra) {
        const r = MR.use(s, id, arg, extra);
        if (r.ok) {
          (s.chapters || []).forEach((c) => { if (MR.chapterRisk) c.risk = MR.chapterRisk(c); });
          s.risk = Math.max(0, ...(s.chapters || []).map((c) => ((c.risk || {}).score) || 0)) || 0;
          if (id === 'revisit') r.hint = '现在可以改口径了：调 rewriteChapter(章号, {F003:"spin"})。';
        }
        r.state = MR.summary(s);
        return r;
      },
      demands: () => MR.lawyer(s),
      resolveDemand: function (chapterNo, how) {
        const r = MR.resolveDemand(s, chapterNo, how);
        if (r.ok) {
          const ch = s.chapters.find((c) => c.chapter === chapterNo);
          const dem = MR.lawyer(s).find((d) => d.chapter === chapterNo);
          if (dem) dem.done = true;
          if (ch) s.log.push({ t: 'lawyer', chapter: chapterNo, how: how, score: (ch.risk || {}).score });
        }
        return r;
      },
      stars: function (year) {
        const y = year || s.year;
        return (MR.STARS || []).filter((x) => x.years && y >= x.years[0] && y <= x.years[1])
          .map((x) => Object.assign({}, x, { sameClub: x.club === s.club, mine: Math.round((MR.ability(s) / 20) * 100) }))
          .sort((a, b) => b.ovr - a.ovr).slice(0, 12);
      },
      geoNote: function (clubId) { return (MR.GEO || {})[clubId || s.club] || null; },
      motifs: function () {
        const used = {};
        (s.chapters || []).forEach((c) => { if (c.motif) used[c.motif] = (used[c.motif] || 0) + 1; });
        return Object.keys(used).map((k) => { const r = MR.realById(k) || {}; return { id: k, name: r.name, src: r.src, n: used[k] }; });
      },
      book: () => MR.assembleBook(s),
      serialize: () => JSON.stringify(strip(s)),
      load: (json) => {
        Object.assign(s, typeof json === 'string' ? JSON.parse(json) : json);
        if (!s.edition) s.edition = 'mid';                                  // v2 旧档：没这个字段
        if (s.alloc == null && !s.allocLocked) s.alloc = null;              // v4：旧档没加点→维持掷骰那套
        if (!s.style && MR.styleOf) s.style = MR.styleOf(s.attrs).id;
        if (s.capTotal == null) s.capTotal = Object.keys(s.stageCaps || {}).reduce((a, k) => a + (s.stageCaps[k] || 0), 0);
        s.rndFn = MR.rng((s.seed + 1 + s.evIdx * 13) >>> 0); return api;
      },
    };

    // 与在场所有人的关系均值：谈话的代价最终落在这里
    function relation(st) {
      const ks = ['cui', 'shao', 'pei', 'kuang', 'vuko', 'yan', 'duan', 'hao'];
      let n = 0, sum = 0;
      ks.forEach((k) => { if (st.trust[k] != null) { sum += st.trust[k]; n++; } });
      const trustAvg = n ? sum / n : 50;
      // v3：关系网占 3 成——谁肯替我说话，编辑看得见
      const people = MR.squad ? MR.squad() : [];
      if (!people.length) return trustAvg;
      const relAvg = people.reduce((a, p) => a + (st.rel[p.id] != null ? st.rel[p.id] : 45), 0) / people.length;
      return trustAvg * .7 + relAvg * .3;
    }

    function growthOf(opt) {
      const m = (opt.mods && opt.mods.attrs) || {};
      let n = 0; for (const k in m) n += m[k];
      return n >= 4 ? .8 : n >= 2 ? .5 : n > 0 ? .3 : .1;
    }
    function driftPenalty(st) {
      const cited = st.facts.filter((f) => typeof f.usedIn === 'number');
      const sp = cited.filter((f) => f.stance === 'spin').length;
      return Math.min(34, sp * 3);
    }
    function hurtPeople(st, chosen, omitted) {
      const hit = new Set();
      chosen.forEach((f) => { if (f.stance === 'spin') (f.hurt || []).forEach((k) => hit.add(k)); });
      omitted.forEach((f) => (f.hurt || []).forEach((k) => hit.add(k)));
      hit.forEach((k) => { if (st.trust[k] != null) st.trust[k] = clamp(st.trust[k] - 7, 0, 100); });
    }
    function pick2(f) {
      return {
        id: f.id, kind: f.kind, t: f.t, spin: f.spin || null, om: f.om, hard: !!f.hard,
        reveal: !!f.revealed,
        omitLocked: !!f.hard || (f.om || 0) < MR.OMIT_MIN,
        stance: (s.pending.stances && s.pending.stances[f.id]) || 'real',
        selected: (s.pending.stances && s.pending.stances[f.id]) !== 'omit',
      };
    }
    // ---------- 开局加点：只在 roll 阶段可改，改完就是终身的 ----------
    function applyAlloc(pts) {
      if (!MR.validAlloc) return { ok: false, why: '加点模块没载进来' };
      if (s.phase !== 'roll') return { ok: false, why: '已经开局了：这 5 个数改不了，和掷出来的一样' };
      const v = MR.validAlloc(pts);
      if (!v.ok) return { ok: false, why: v.why, left: v.left };
      MR.ALLOC.keys.forEach((k) => (s.attrs[k] = v.vals[k]));
      s.attrs.rarity = MR.talentRarity(s.attrs);
      s.style = null;                                        // 先把旧形状记号抹掉：不然 styleOf 会拿着上一副身体的结论
      s.alloc = {};
      MR.ALLOC.keys.forEach((k) => (s.alloc[k] = pts[k]));
      s.style = MR.styleOf ? MR.styleOf(s).id : null;
      s.allocLocked = true;
      return { ok: true, vals: v.vals, style: MR.styleOf ? MR.styleOf(s) : null, rarity: s.attrs.rarity };
    }

    function strip(o) { const c = Object.assign({}, o); delete c.rndFn; return c; }
    return api;
  };

  // ---------------- 章节来源：模板 or 模型 ----------------
  MR.produceChapter = async function (s, ctx, requiredIds) {
    const tpl = MR.writeChapter(s, ctx);
    const take = (s.takes = s.takes || {}); take[ctx.index] = (take[ctx.index] || 0) + 1;
    s.take = take[ctx.index];
    const req = requiredIds || [];
    const cfg = MR.cfg || {};
    const v = (md) => MR.validateChapter(md, ctx.facts, ctx.omitted, req, s);
    return { markdown: tpl.markdown, validation: v(tpl.markdown), source: 'template', ctx, stanceMix: tpl.stanceMix };
  };


  // ---------------- 结局：身份 × 诚实度 ----------------
  function computeEndings(s) {
    const cited = s.facts.filter((f) => typeof f.usedIn === 'number');
    const real = cited.filter((f) => f.stance === 'real').length;
    const spin = cited.filter((f) => f.stance === 'spin').length;
    const omit = s.facts.filter((f) => f.stance === 'omit').length;
    const blanked = s.facts.filter((f) => f.stance === 'blank').length;
    const honesty = real - spin * 2;
    const total = (MR.EVENTS || []).length || 1;
    const completeness = s.chapters.length / Math.max(1, (MR.STAGES || []).reduce((a, x) => a + x.chapterCap, 0));
    const perms = Object.keys(s.perms).length;
    const rel = ['cui', 'shao', 'pei', 'kuang', 'vuko', 'yan', 'duan', 'hao'].reduce((a, k) => a + (s.trust[k] || 0), 0) / 8;
    // v3：销量 / 对号入座 / 社交圈——这 3 个量把“写法”变成“走势”
    const sales = MR.sales ? MR.sales(s) : { copies: 0, edition: 1, risk: 0, unresolved: 0, honesty: honesty };
    const ident = (s.chapters || []).filter((c) => ((c.risk || {}).score || 0) >= (MR.RISK_HARD || 76)).length;
    const grants = (s.grants || []).length, leaks = (s.leaks || []).length;
    const chem = MR.chemistry ? MR.chemistry(s) : { score: 0 };
    const roleRank = { player: 0, sparring: 1, coach: 2, agent: 3, founder: 3 };
    let last = 'player', lv = 0;
    for (const k in s.roles) if (s.roles[k] > lv || (s.roles[k] === lv && roleRank[k] > roleRank[last])) { lv = s.roles[k]; last = k; }
    let key, title, body;
    if (s.flags.includes('liePublished') && perms < 2) {
      key = 'lawsuit'; title = '《下架》';
      body = '书在 11 月 14 日上架，11 月 21 日下架。两家俱乐部各发了 1 份声明，措辞 1 样。周迟把稿费退了 1 半，另 4 万他收了，他说那是他写的字的钱。';
    } else if (s.dayLeft <= 0 && completeness < .8) {
      key = 'late'; title = '《未交稿》';
      body = `稿子停在第 ${s.chapters.length} 章。周迟把文件打包发回给我，附了 1 句话：这个你自己留着吧。我没删，我也没继续写。`;
    } else if (sales.unresolved >= 2) {
      key = 'pulped'; title = '《纸浆》';
      body = `法务回信 2 封，我 1 封都没回。首印 ${Math.round(sales.copies * 10) / 10} 万册进了纸浆，出版社把销毁单寄给我，上面写了 1 句“可回收”。我把它夹进那本没出的书里。`;
    } else if (s.gaps >= 3 || (s.gaps + blanked) >= 5) {
      key = 'cut'; title = '《删节本》';
      body = `目录上有 ${s.gaps + blanked} 处只写着“此处有 1 段”。有读者在论坛上把那几处拼了 1 遍，拼错了，我没有纠正。`;
    } else if (last === 'agent' && lv >= 2 && honesty < 4) {
      key = 'contracts'; title = '《别人的合同》';
      body = '书印了 2 万册，卖的不是我的球，是我替别人谈过的 21 份合同。沈皓在签售会上排队等我签名，我签了，我的手很稳。';
    } else if ((last === 'coach' || last === 'founder') && lv >= 2) {
      key = 'sideline'; title = '《场边的人》';
      body = last === 'founder'
        ? '书最后的 3 章在写足校的账。有家长问我当年为什么被刷下来，我说因为我慢。这句话我练了 20 年。'
        : '书出版那天我在带 U15。我把书发给我的队员，只写了 1 句话：第 9 章背下来，别学。';
    } else if (sales.edition >= 2 && honesty >= 6 && sales.copies >= 6 && perms >= 2 && sales.unresolved === 0 && grants >= 2) {
      key = 'reprint'; title = '《再版》';
      body = `首印卖完那周出版社来了第 2 封信：加印，并且要第 2 版。我在第 2 版里加了 ${grants + 1} 条脚注，把 3 个名字换成了称呼。他们骂我改了，没有 1 家俱乐部告我侵权。`;
    } else if (honesty >= 6 && perms >= 2 && s.editorial >= 78) {
      key = 'named'; title = '《署名》';
      body = '书出来了，署我的真名。崔玉安买了 1 本，在扉页写了 1 行字：这次没写错。我把书放在桌上，一直没拆封。';
    } else if (ident >= 2 && sales.copies >= 2.6) {
      key = 'alleged'; title = '《影射本》';
      body = `书里没有任何 1 个真名字，可 ${ident} 章让人对得上号。法务签字放行，律师函 1 封也没来。读者在评论区直接写了全名，那 1 段后来被删了——不是我让人删的。`;
    } else if (grants >= 4 && leaks === 0 && honesty >= 3) {
      key = 'chorus'; title = '《众证》';
      body = `这本书里有 ${grants} 个别人的声音：有人给我作了证，有人把自己的那 1 页给了我。没有 1 个人在事后反口。周迟说这比写得好难，我说对。`;
    } else if (honesty >= 2 && s.editorial >= 52) {
      key = 'ghost'; title = '《代笔》';
      body = '书出来了。封底写着：由周迟根据录音与病历整理。我签字的时候手很稳，回家以后把那支笔扔了。';
    } else if (grants === 0 && leaks >= 2) {
      key = 'alone'; title = '《孤证》';
      body = `书里只有我 1 个人的说法，而我说过的 ${leaks} 段都有人先说了。出版社要第 3 方签字，我名单上想不出 1 个人。最后 1 页我印了 1 张空页，上面只有 1 行：这本书没人替我证。`;
    } else if (s.career.apps < 40 && s.rep < 25) {
      key = 'nobody'; title = '《没人记得》';
      body = `出场 ${s.career.apps} 次，进球 ${s.career.goals} 个。出版社要 3 万 5 的宣传费，我没给。书在自家书架上，第 1 页写着我的名字，别的人不认得。`;
    } else {
      key = 'clean'; title = '《干净的本子》';
      body = '书出来了，卖得很好。里面那个人比我会说话。签售会上有人夸他，我没有纠正。';
    }
    const unwritten = s.facts.filter((f) => !f.usedIn).length;
    if (unwritten >= 3) body += ` 账上还有 ${unwritten} 条我没交。周迟没催，他在等。`;
    return {
      key, title, body,
      metrics: {
        chapters: s.chapters.length, unwritten, real, spin, omit, blanked, forced: s.forced || 0, honesty, perms,
        editorial: s.editorial, relation: Math.round(rel), debt: s.debt, money: s.money,
        sideCash: s.sideCash, roles: MR.roleList(s), certs: s.certs.slice(), retired: s.retired,
        honors: s.honors.slice(), apps: s.career.apps, goals: s.career.goals, seasons: s.career.seasons,
        talk: Object.assign({}, s.talkStats),
        sales: sales.copies, salesLabel: sales.label, edition: sales.edition,
        risk: s.risk || 0, identChapters: ident, unresolved: sales.unresolved,
        grants: grants, leaks: leaks, meetLeft: MR.meetLeft ? MR.meetLeft(s) : 0,
        narr: Object.assign({}, s.narr || {}), cuts: (s.cuts || []).length, notes: Object.keys(s.notes || {}).length,
        chem: chem.score, chemLabel: chem.label, expose: s.expose || 0, lawyerFights: s.lawyerFights || 0,
      },
    };
  }
  MR.computeEndings = computeEndings;
})();

  </script>
  <script>/* 封闭版不装 src/account.js：可选联网层（云档 / 电视台 / 模型网关） */</script>
  <script>
/* ——— ui.js ——— */
/* UI：单页、无框架、无构建。所有渲染都是字符串拼接 + 事件委托。
 * 阶段：roll → talk → decide → chapter → review →（每卷 1 次）present → end
 * talk 阶段的输入框就是“打字”：20 字上限，宣告意图不宣告结果，数字补选 6-9。
 */
(function () {
  const MR = globalThis.MR || (globalThis.MR = {});
  const $ = (x) => document.querySelector(x);
  const $$ = (x) => Array.from(document.querySelectorAll(x));
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  let game = null;
  const SAVE = 'mrz-save-v2';
  const view = { tab: 'toc', book: false, tv: { mine: null, shelf: null, busy: false }, tvAi: false };

  MR.cfg = MR.cfg || { mode: 'template', baseUrl: '', model: 'gpt-4o-mini', key: '', temperature: .7, stripMarks: true, proxy: false };

  function boot() {
    const raw = load();
    if (raw) {
      try {
        game = MR.createGame({ seed: (raw && raw.seed) || 20260824 });
        game.load(raw);
      } catch (e) { game = null; }
    }
    if (!game) game = MR.createGame({ seed: 20260824 });
    MR.uiGame = game;
    window.addEventListener('error', (e) => toast('页内报错：' + e.message));
    // 手机上：软键盘弹起来，别让输入框顶到看不见的地方（只在窄屏做，桌面不抖）
    document.addEventListener('focusin', (e) => {
      const t = e && e.target;
      if (!t || !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || window.innerWidth >= 880) return;
      setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) { } }, 260);
    });
    render();
    // 账号：能连上就上线，连不上就当地下工作者（玩法不受影响；只有存档要注册）
    if (MR.acctInit) MR.acctInit().then(async (r) => {
      render();
      if (!r || r.offline) return;
      try {
        const list = await MR.acct.cloudList();
        const lb = localBook();
        if (lb && lb.id && MR.acct.unsynced && MR.acct.unsynced(lb.id).has) { view.unsynced = lb.id; render(); }
        if (list && list.length && !load()) toast('云上有 ' + list.length + ' 局：去「账户」读回来');
      } catch (e) { }
    }).catch(() => { });
  }

  function load() { try { const t = localStorage.getItem(SAVE); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
  const LAT = 'mrz-save-at';
  /** 把本机档整理成能上云的那 1 份：存档号坐实（写回本机档，屏上这本也认它）。
   *  不然下次存盘又发 1 个号，云上就多 1 本重复的。 */
  function prepMigrate() {
    const A = MR.acct || {};
    const lb = localBook();
    if (!A.on || !lb || !A.rawOf) return null;
    const obj = A.rawOf(lb.json);
    if (!obj) return null;
    try { localStorage.setItem(SAVE, obj.state); } catch (e) { }
    if (game && !game.state.playId) game.state.playId = obj.id;
    return obj;
  }
  /** 这台浏览器里的本机档：拿到原文与时间戳，用来判断“云上有没有这局”与迁移。 */
  function localBook() {
    let json = '';
    try { json = localStorage.getItem(SAVE) || ''; } catch (e) { return null; }
    if (!json) return null;
    let obj = null;
    try { obj = JSON.parse(json); } catch (e) { return null; }
    if (!obj || typeof obj !== 'object') return null;
    let at = 0;
    try { at = Number(localStorage.getItem(LAT) || 0) || 0; } catch (e) { }
    return { json: json, obj: obj, at: at, id: obj.playId || '' };
  }
  function doSave(quiet) {
    const A = MR.acct;
    try {
      // 存档号在本机这 1 步就配好：云端写挂了也有号，下次不会另发 1 个变成两本。
      if (!game.state.playId && A && A.playId) game.state.playId = A.playId();
      localStorage.setItem(SAVE, game.serialize()); localStorage.setItem(LAT, String(Date.now()));
    } catch (e) { toast('这台浏览器不让存'); return; }
    if (A && A.on && A.canSave && A.canSave()) {
      A.cloudSave(game, game.state.phase === 'end' ? 'finished' : 'playing')
        .then(() => {
          // 云端可能刚给这本配了 1 个存档号：补写 1 次本机档，不然是两台设备对不上号。
          try { localStorage.setItem(SAVE, game.serialize()); } catch (e) { }
          if (!quiet) toast('本机存了，云端也存了');
          render();
        })
        .catch((e) => {
          if (e && e.stale) { view.stale = { id: game.state.playId, at: (e.j && e.j.at) || '' }; if (!quiet) toast('云上那份比这台新：没盖。去「账户」里选'); render(); return; }
          toast('本机存了；云端没上：' + String((e && e.message) || e).slice(0, 50));
        });
      return;
    }
    if (!quiet) toast(MR.closed ? '已存本机：这本只在你这台机器上，换设备带不走' : (A && A.on ? '这 1 台没注册：存不了档' : '已存本机（' + ((A && A.localHandle) || '未建档') + '）'));
  }
  function save() {
    const A = MR.acct;
    if (MR.closed) return doSave();                 // 封闭版：存档就是存本机，没有「先建档」这 1 步
    if (!A || !A.canSave || !A.canSave()) return regBox('要存档，先留个名字——这是本产品唯 1 的门槛。');
    doSave();
  }
  function toast(m) { const t = $('#toast'); if (!t) return; t.textContent = m; clearTimeout(t._h); t._h = setTimeout(() => (t.textContent = ''), 3600); }

  function render() {
    try {
      MR.appState = game.state;                     // 侧栏“打字测试/正文校验”面板读这个
      $('#hud').innerHTML = hudHtml();
      $('#stage').innerHTML = view.book ? stageBook() : ({ roll: stageRoll, talk: stageTalk, decide: stageDecide, chapter: stageChapter, review: stageReview, present: stagePresent, end: stageEnd })[game.state.phase]();
      $('#side').innerHTML = sideHtml();
      const dk = $('#d-save');
      if (dk) { const can = MR.closed || (MR.acct && MR.acct.canSave && MR.acct.canSave()); dk.textContent = MR.closed ? '存档' : (can ? '存档' : '建档'); dk.title = can ? '存本机（注册过就同步于端）' : '存档要先建个档：不收钱'; }
      wire();
      window.__renderErr = null;
    } catch (e) {
      // file:// 下浏览器的 window.onerror 只能拿到“Script error.”，所以自己把堆栈留一们
      window.__renderErr = (e && (e.stack || e.message)) || String(e);
      if (window.console && console.error) console.error('render 崩了', e);
      toast('界面渲染崩了：' + ((e && e.message) || e));
    }
  }

  function hudHtml() {
    const s = game.state, m = MR.summary(s);
    const st = (MR.STAGES || []).find((x) => x.id === (game.event() ? game.event().stage : (s.seenStage || ''))) || {};
    const cells = [
      ['年 / 岁', `${s.year} · ${s.age}`],
      ['卷', st.name || '—'],
      ['身份', m.roles.length ? m.roles.join(' ') : '还没定'],
      ['身体', `磨损 ${m.wear}`],
      ['锐度', `${m.sharp}${m.benchStreak >= 2 ? ` · 连续 ${m.benchStreak} 年不在名单` : ''}${m.ceilingCut ? ` · 评估被降 ${m.ceilingCut} 档` : ''}`],
      ['账面', `${m.money} 万${m.debt ? ' · 欠 ' + m.debt + ' 万' : ''}`],
      ['交稿', `剩 ${m.dayLeft} 天`],
      ['本卷还能写', `${(s.stageCaps[st.id] == null ? 0 : s.stageCaps[st.id])} 章`],
      ['编辑信任', `${m.editorial}`],
      ['对号入座', m.risk ? `${m.risk}/100` : '干净'],
      ['更衣室连线', m.chem ? `${m.chem} ${m.chemLabel}` : '—'],
      ['约人', !MR.squad || !MR.squad().length ? '没有名单' : (m.meetLeft ? `剩 ${m.meetLeft} 次` : '这一卷用完了')],
      ['叙述权', Object.keys(m.narr || {}).filter((k) => m.narr[k]).length ? Object.keys(m.narr).filter((k) => m.narr[k]).map((k) => MR.narrName(k) + '×' + m.narr[k]).join(' ') : '还没人教我'],
      ['销量', m.sales ? `${m.sales} 万册（${m.salesLabel}）` : '—'],
      ['成书', bookCell()],
      ['这副身体', buildCell()],
    ];
    return cells.map((c) => `<div class="cell"><i>${c[0]}</i>${esc(c[1])}</div>`).join('');
  }

  // ---------------- 开局：那 100 点自己分 ----------------
  let draft = null;
  const DRAFT = 'mrz-draft';
  const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const draftKey = () => game.state.seed + '|' + (game.state.edition || 'mid');
  function keepDraft(pts) { try { localStorage.setItem(DRAFT, JSON.stringify({ k: draftKey(), pts: pts })); } catch (e) { } }
  function savedDraft() {
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT) || 'null');
      if (!d || d.k !== draftKey() || !d.pts) return null;
      const lim = MR.ALLOC, keys = lim.keys;
      if (!keys.every((k) => Number.isInteger(d.pts[k]) && d.pts[k] >= 0 && d.pts[k] <= lim.max)) return null;
      if (keys.reduce((a, k) => a + d.pts[k], 0) > lim.total) return null;
      return d.pts;
    } catch (e) { return null; }
  }
  function draftPts() {
    const st = game.state;
    const want = st.alloc ? Object.assign({}, st.alloc) : (savedDraft() || MR.flatAlloc());
    if (!draft || draft.k !== draftKey() || JSON.stringify(draft.pts) !== JSON.stringify(want)) draft = { k: draftKey(), pts: want };
    return draft.pts;
  }
  function stepPts(k, dv) {
    const pts = draftPts(), lim = MR.ALLOC;
    const left = lim.total - lim.keys.reduce((a, x) => a + (pts[x] || 0), 0);
    if (dv > 0 && left <= 0) {
      // 手里没点了：从给得最多的那 1 项挪 1 口过来，省得先按减再加
      const donor = lim.keys.filter((x) => x !== k && pts[x] > 0).sort((a, b) => pts[b] - pts[a])[0];
      if (donor == null) return toast('100 点已经分完，没有可挪的');
      pts[donor] = clampN(pts[donor] - dv, 0, lim.max);
    }
    pts[k] = clampN((pts[k] || 0) + dv, 0, lim.max);
    keepDraft(pts);
    render();
  }

  function stageRoll() {
    const st = game.state, a = st.attrs, lim = MR.ALLOC || { total: 100, max: 36, keys: ['spd', 'tech', 'sta', 'iq', 'grit'] };
    const pts = draftPts();
    const chk = MR.validAlloc ? MR.validAlloc(pts) : { ok: true, used: lim.total, vals: a };
    const pv = MR.buildPreview ? MR.buildPreview(chk.vals || a) : null;
    const style = pv ? pv.style : (MR.styleOf ? MR.styleOf(a) : { name: '—', note: '' });
    const row = (k) => {
      const p = pts[k] || 0, val = MR.toValue(p);
      return `<div class="prow" data-k="${k}">
<span class="pl"><b>${MR.ATTR_LABEL[k]}</b><span class="abar"><i style="width:${Math.round((val / 20) * 100)}%"></i></span></span>
<span class="pp"><button class="stp" data-pt="${k}|-2" ${p <= 0 ? 'disabled' : ''} aria-label="减 2 点">−</button><em>${p}<i>点</i></em><button class="stp" data-pt="${k}|2" ${p >= lim.max ? 'disabled' : ''} aria-label="加 2 点">+</button></span>
<span class="pv">成 ${val} 级</span></div>`;
    };
    const left = lim.total - (chk.used || 0);
    const locked = !!st.alloc && st.phase !== 'roll';
    const gates = pv ? pv.gates : [];
    const inRoom = gates.filter((g) => g.ok && g.form === 'min'), outRoom = gates.filter((g) => !g.ok);
    const weakRoom = gates.filter((g) => g.ok && g.form !== 'min');   // 短板门与形状门：这两类是弱势换来的
    const opps = pv ? pv.opps.filter((o) => o.ok) : [];
    return `<div class="card roll">
<h2>1988 年 3 月，我生下来 2 斤 9 两</h2>
<p class="mut">这 5 个数不由天定：<b>${lim.total} 点你自己分</b>，单项上限 ${lim.max} 点（到顶就 20 级）。分完就是这辈子的天花板，开局以后不能改——跟掷出来的一样算。</p>
<div class="ptbar ${left === 0 ? 'ok' : 'no'}"><b>${chk.used || 0}</b><i>/ ${lim.total} 点</i><em>${left === 0 ? '分完了' : left > 0 ? '还剩 ' + left + ' 点' : '超出 ' + (-left) + ' 点'}</em></div>
<div class="pts">${lim.keys.map(row).join('')}</div>
${locked ? '<p class="warn">这 5 个数已经定了：本局不能重分。</p>' : `<p class="btnrow tight"><button class="tiny" id="a-flat">均分</button><button class="tiny" id="a-rand">让运气替我分</button><button class="tiny" id="a-clear">清回 0</button></p><p class="mut">「让运气替我分」只改这 5 个数怎么落，不改命：每年的骰子按「种子 + 年份」派生，多扔 1 次不会把你这 1 生挪开 1 格（想换命就重新开 1 局）。</p>`}
<p class="lead">这么分我是：<b>${esc(style.name)}</b>——${esc(style.note || '')}</p>
<p class="mut">体校评级：<b>${esc((pv && pv.rarity) || a.rarity)}</b>。${a.glass >= 1.5 ? '膝盖比常人脆（伤×1.75）。' : a.glass <= .85 ? '身体耐用。' : '膝盖正常。'}</p>
${pv && pv.risky.length ? '<p class="warn">短板警告：' + pv.risky.join('、') + ' 只给了 0-4 点。那 1 项不会自己长回来——它会在 20 岁前后具体输 1 次给我看。</p>' : ''}
${opps.length ? `<p class="gain">这么分多出来的路：${opps.slice(0, 4).map((o) => '「' + esc(o.label) + '」').join('、')}${opps.length > 4 ? ' 等 ' + opps.length + ' 条' : ''}</p>` : '<p class="mut">这个分法得不出额外的路：那 18 条各要 1 项到 14 级以上，或者要某项几乎没给点。</p>'}
${weakRoom.length ? `<p class="gain">短板替你开的门：${weakRoom.slice(0, 3).map((g) => '「' + esc(g.label) + '」').join('、')}${weakRoom.length > 3 ? ' 等 ' + weakRoom.length + ' 扇' : ''}——这几件事只有那时候真不懂的人才做得出来。</p>` : ''}
${outRoom.length ? `<p class="mut">这副身体接不了的活：${outRoom.slice(0, 3).map((g) => esc(g.label) + '：' + esc(g.miss)).join('／')}${outRoom.length > 3 ? ' 等 ' + outRoom.length + ' 项' : ''}</p>` : ''}
${inRoom.length ? `<p class="mut">接得了的：${inRoom.slice(0, 5).map((g) => esc(g.label)).join('／')}${inRoom.length > 5 ? ' 等 ' + inRoom.length + ' 项' : ''}</p>` : ''}
<p class="mut old">运气原本给我的是：${lim.keys.map((k) => MR.ATTR_LABEL[k] + ' ' + ((st.roll0 || a)[k])).join(' ')}。</p>
${editionPicker()}
${regHint()}
<p class="btnrow"><button class="big" id="go" ${chk.ok && !locked ? '' : 'disabled'}>${st.alloc ? '就按这 100 点，开始' : '分完了，开始这 1 生'}</button>${locked || st.alloc ? '' : '<button id="go-dice">不分了，照掷出来的开始</button>'}</p>
${!chk.ok && !locked ? `<p class="warn">${esc(chk.why)}</p>` : ''}</div>`;
  }

  // 注册引导：全书免费，只有 1 件事要注册——存档
  function regHint() {
    if (MR.closed) return '';                        // 封闭版：没得注册，也不欠谁 1 个邮箱
    const A = MR.acct || {};
    if (A.canSave && A.canSave()) return `<p class="reg ok">已建档：<b>${esc((A.user && (A.user.handle || A.user.email)) || A.localHandle || '本机')}</b> · 换设备也读得回来</p>`;
    return `<p class="reg">全书免费，没有 1 个收费点。只有 1 件事要注册：<b>存档</b>。<button class="tiny" id="reg-here">现在建 1 个</button></p>`;
  }

  // ---------------- 对话（打字） ----------------
  function stageTalk() {
    const ev = game.event(), s = game.state, tk = s.talk || {};
    const npc = MR.WORLD.npcs[tk.who] || {};
    const dots = Array.from({ length: Math.max(0, tk.patience) }, (_, i) => `<i class="${i < tk.patienceLeft ? 'on' : 'off'}"></i>`).join('');
    const log = (tk.log || []).map((r) => `<p class="dlg"><b>我：</b>${esc(r.text)} <span class="v v-${r.verdict}">${r.verdict}</span>${r.reply ? `<br><b>${esc(npc.short)}：</b>${esc(r.reply)}` : ''}${r.reason ? `<br><span class="mut">${esc(r.reason)}</span>` : ''}</p>`).join('');
    const chips = ((ev.talk && ev.talk.topics) || []).map((t) => `<button class="chip" data-say="${esc(t)}">${esc(t)}</button>`).join('');
    return `<div class="card">
<div class="when">（${ev.year} 年 · 我 ${ev.age} 岁 · ${esc(ev.place || '')}）</div>
<h2>${esc(ev.title)} · 先说话</h2>
<p class="lead"><b>${esc(npc.name || '他')}</b>在这儿。他要的是：${esc((ev.talk || {}).want || '—')}
<span class="pat">他的耐心 ${dots}</span></p>
<p class="mut">我手上有的：${((ev.talk && ev.talk.has) || []).map(esc).join('、') || '没有'}。只能提这些；说没有的东西，会被当面戳穿。</p>
<div class="prose">${(ev.scene || '').split('\n').map((x) => `<p>${esc(x)}</p>`).join('')}</div>
<div class="talklog">${log || '<p class="mut">他还没开口。你先说。</p>'}</div>
${chips ? `<p class="chips">想问什么：<span>${chips}</span></p>` : ''}
<p class="typebox"><input id="say" maxlength="20" placeholder="说一句你要做的事或要问的话（20 字内）" ${tk.closed ? 'disabled' : ''}>
<span class="cnt" id="cnt">0/20</span>
<button class="big" id="saybtn" ${tk.closed ? 'disabled' : ''}>说</button>
<button id="hush">不说了 →</button></p>
<p class="mut">规则同刀鋒的「打字」：只能说你要做什麼，不能说你做成了什么；这里的世界不配合你的宣称。</p>
${tk.closed ? '<p class="warn">他把话讲完了。该做决定了。</p>' : ''}</div>`;
  }

  // ---------------- 决策（keypad + 补选） ----------------
  function stageDecide() {
    const ev = game.event(), s = game.state, tk = s.talk || {};
    const opts = game.visibleOptions();
    const mood = tk.active ? `<p class="mut">刚才那场话：心情 ${tk.mood >= 0 ? '+' : ''}${tk.mood}，问出 ${tk.dug.length} 件事${tk.turns ? `，我说了 ${tk.turns} 句` : ''}。</p>` : '';
    const kb = opts.map((o) => {
      const on = o.available;
      return `<button class="kb ${o.typedOnly ? 'typed' : ''} ${o.expose ? 'expo' : ''} ${o.blur ? 'blurred' : ''} ${on ? '' : 'off'}" data-opt="${o.id}" ${on ? '' : 'disabled'}>
<span class="n">${o.n}</span><b>${esc(o.label)}</b>${o.note ? `<i>${esc(o.note)}</i>` : ''}
<span class="tags">${o.typedOnly ? '<em class="tag6">只能打字选</em>' : ''}${o.locked && !o.gate ? '<em class="tag6">要身份</em>' : ''}
${o.gate ? `<em class="tag6 no" title="${esc(o.gateWhy)}">身体不够：${esc(o.gateShort || '')}</em>` : ''}${o.fromBuild ? '<em class="tag6 gold">这么分才有的路</em>' : ''}
${o.expose ? '<em class="tag6 hot">写真实：风险 +22</em>' : ''}${o.blur ? '<em class="tag6">写模糊：风险 -18</em>' : ''}${o.from ? `<em class="tag6">关系换来的</em>` : ''}</span></button>`;
    }).join('');
    return `<div class="card">
<div class="when">（${ev.year} 年 · 我 ${ev.age} 岁 · ${esc(ev.place || '')}）</div>
<h2>${esc(ev.title)}</h2>
<div class="prose">${(ev.scene || '').split('\n').map((x) => `<p>${esc(x)}</p>`).join('')}</div>
${mood}
<p class="ask">${esc(ev.prompt || '怎么做。')}</p>
<div class="keypad">${kb}</div>
<p class="typebox"><input id="say2" maxlength="20" placeholder="不合心意就打字：说你要做的事，或打 6、7 补选下面这些">
<button id="saybtn2">说</button></p>
<p class="mut">打数字（6、选 7、第 8 项都行）= 跟按下那 1 键 1 样执行；打不存在的号码不算回合。</p>
${socialBlock()}</div>`;
  }

  // ---------------- 口径 + 选材 ----------------
  function stageChapter() {
    const isRevisit = s().revisitIdx != null;
    const ev = isRevisit ? (MR.EVENTS[s().revisitIdx]) : game.event();
    const cap = isRevisit ? null : s().stageCaps[ev.stage];
    const capTxt = isRevisit
      ? `这是补写：不占本卷章数，但占交稿前 ${1} 天（现在剩 ${s().dayLeft} 天）。`
      : `这一卷还能写 ${cap} 章。整段不写也行——目录上会留 1 行“此处有 1 段”，读者看得见空着的地方。`;
    const rows = game.candidates().map((f) => {
      const st = f.stance;
      return `<div class="fact ${st === 'omit' ? 'omitted' : ''}" data-id="${f.id}">
<span class="ftx"><b>${f.id}</b> ${esc(f.t)}${f.spin ? `<div class="spin">美化版：${esc(f.spin)}</div>` : ''}</span>
<span class="hardtag">${f.hard ? '硬事实' : '可瞒 ' + f.om}${f.reveal ? ' · 现场挖出' : ''}</span>
<span class="stance">
<label class="${st === 'real' ? 'on' : ''}"><input type="radio" name="st_${f.id}" value="real" ${st === 'real' ? 'checked' : ''}>实话</label>
<label class="${st === 'spin' ? 'on' : ''}"><input type="radio" name="st_${f.id}" value="spin" ${st === 'spin' ? 'checked' : ''}>美化</label>
<label class="${st === 'omit' ? 'on' : ''} ${f.omitLocked ? 'no' : ''}"><input type="radio" name="st_${f.id}" value="omit" ${f.omitLocked ? 'disabled' : ''}>不提</label>
</span></div>`;
    }).join('');
    return `<div class="card">
<div class="when">（${isRevisit ? '补写' : '写书'} · 第 ${s().chapters.length + 1} 章候选 · ${ev.year}）</div>
<h2>${esc(ev.title)} · 你要怎么写这段</h2>
<p class="mut">${capTxt}</p>
<div class="facts">${rows || '<p class="mut">这一段没有可写的事实。</p>'}</div>
<p class="btnrow">
<button class="big" id="gen" ${cap !== null && cap <= 0 ? 'disabled title="这一卷的章数用完了：只能留白，或去补写"' : ''}>${MR.cfg.mode === 'model' ? '交给模型写 →' : '生成这 1 章（离线模板）→'}</button>
${isRevisit ? '<button id="rv-cancel">先不补了</button>' : '<button id="blank">整段留白</button>'}
<button id="allspin">全部改美化</button><button id="allreal">全部改实话</button></p>
${isRevisit ? '<p class="mut">补写不合适就点「先不补了」：不扣交稿日，回到刚才那一步。</p>' : (cap !== null && cap <= 0 ? '<p class="warn">这一卷的章数已经用完，只能留白（或者去补写别卷）。</p>' : '')}</div>`;
  }

  function badge(v) {
    if (!v) return '<span class="badge fail">还没校过</span>';
    return v.ok ? '<span class="badge pass">校验通过</span>' : `<span class="badge fail">退回 ${v.hard.length} 处</span>`;
  }
  function issueList(v) {
    if (!v || !v.issues || !v.issues.length) return '';
    return `<div class="issues"><b>闸门记录</b>${v.issues.slice(0, 12).map((i) => `<div class="q"><code>${i.type}</code> 第 ${i.at + 1} 行：${esc(i.why)}<br><i>${esc(i.sent)}</i></div>`).join('')}</div>`;
  }
  function stageReview() {
    const c = game.state.chapters[game.state.chapters.length - 1];
    if (!c) { game.state.phase = 'chapter'; return stageChapter(); }
    const stg = (MR.STAGES || []).find((x) => x.id === (c.stage || '')) || {};   // 看的是这一章自己的卷，不是下一站的
    const capLeft = game.state.stageCaps[c.stage];
    const src = c && c.source === 'model' ? '模型' : '模板';
    const who = c && c.provider ? `<span class="mut"> · 这章是 ${esc(c.provider)} 写的${c.switched ? '（第 1 家没成，换过来的）' : ''}</span>` : '';
    const rej = c.rejected ? `<p class="warn">已退回${src === 'model' ? '模板版' : '模板'}：${esc(c.rejected.reason)}</p>` : '';
    return `<div class="card"><h2>第 ${c.chapter} 章 ${esc(c.ctx.title)} ${badge(c.validation)}${who}</h2>
<p class="mut">来源：${src} · 引用 ${(c.validation && c.validation.cited ? c.validation.cited.length : 0)} 条 · 口径 实话 ${c.stanceMix.real} / 美化 ${c.stanceMix.spin} · 《${esc(stg.name || '本卷')}》还能写 ${capLeft == null ? '—' : capLeft} 章</p>
${rej}<div class="draft">${esc(c.markdown)}</div>${issueList(c.validation)}
<p class="btnrow"><button id="regen">换 1 种写法重写</button><button class="big" id="accept">收进书里 →</button></p>${narrBlock(c)}</div>`;
  }

  // ---------------- 现在线（每卷 1 次）----------------
  function stagePresent() {
    const st = s().presentStage, P = game.present() || { options: [] };
    const stg = (MR.STAGES || []).find((x) => x.id === st) || {};
    const rev = game.revisitList();
    const opts = (P.options || []).map((o) => `<button class="kb" data-p="${o.id}"><span class="n">·</span><b>${esc(o.label)}</b>${o.note ? `<i>${esc(o.note)}</i>` : ''}${o.gate ? `<i class="gate ${o.gate.ok ? 'ok' : 'no'}">${esc((MR.WORLD.npcs[o.gate.who] || {}).short)}的信任 ${o.gate.at}，要到 ${o.gate.need} 他才点头</i>` : ''}${o.reveal ? '<i>会翻出旧那卷的 1 件事</i>' : ''}</button>`).join('');
    return `<div class="card">
<div class="when">（现在 · 2026 年 11 月 · 交稿前 ${s().dayLeft} 天）</div>
<h2>第 1 次算总账：《${esc(stg.name || '')}》这一卷</h2>
<div class="prose">${(P.scene || '周迟在等我。').split('\n').map((x) => `<p>${esc(x)}</p>`).join('')}</div>
<div class="choices">${opts}</div>
${rev.length && s().dayLeft > 0 ? `<details class="rvbox"><summary>← 先不往下走，回去补写（${rev.length} 段有未册的事；每段花 1 天交稿日，不占本卷章数）</summary><div class="rvlist">${rev.map((x) => `<div class="cloudrow"><b>${esc(x.title)}</b><i class="mut">${x.year} 年 · 未册 ${x.facts.length} 条</i><button class="tiny" data-rv="${esc(x.id)}">补这段</button></div>`).join('')}</div></details>` : ''}
<p class="mut">账面 ${s().money} 万 · 欠 ${s().debt} 万 · 身份 ${(MR.summary(s()).roles || []).join(' ')} · 编辑信任 ${s().editorial} · 本卷还能写 ${(s().stageCaps[st] == null ? 0 : s().stageCaps[st])} 章</p>${lawBlock()}</div>`;
  }

  // ---------------- 结局 / 成书 ----------------
  // 分享：只在 http(s) 下有脸——file:// 拿不出 1 个别人能点的链接，那就别摆 1 颗按了没用的钮
  const shareable = () => /^https?:$/.test(location.protocol);
  function shareBtn() { return shareable() ? '<button id="btn-share">把链接发给别人</button>' : ''; }
  async function doShare() {
    const url = location.href.split('#')[0];
    const text = '《足球之路》· 从 1988 写到 2026：分数、伤病、钱由引擎裁决，你只负责写。手机浏览器打开就能玩，不装 App、不收钱。';
    // 上 1 道 4s 时限：桌面 Chrome 拿不到用户激活时 navigator.share 的 promise 会悬着不 settle，
    // 不兑掉就是「按了 1 下什公都没生」——分享这东西宁可退成抄链接，不能静默。
    if (navigator.share) {
      try {
        await Promise.race([navigator.share({ title: '足球之路', text, url }), new Promise((_, rej) => setTimeout(() => rej(new Error('share 没应答')), 4000))]);
        toast('发出去了'); return;
      }
      catch (e) { if (e && e.name === 'AbortError') { toast('取消了，没发'); return; } }
    }
    copy(url + ' ' + text);
    toast('链接连同这句话抄好了，粘给谁都行');
  }
  function stageEnd() {
    const e = game.endings(), m = e.metrics;
    return `<div class="card"><h2>${esc(e.title)}</h2>
<p class="lead">${esc(e.body)}</p>
<table class="led"><tr><th>事实</th><td>${m.real + m.spin + m.omit} 条已交：如实 ${m.real}，美化 ${m.spin}，刻意不提 ${m.omit}，整段留白 ${m.blanked}</td></tr>
<tr><th>身份</th><td>${m.roles.join(' · ') || '—'}${m.certs.length ? '（证书 ' + m.certs.join('、') + '）' : ''}</td></tr>
<tr><th>球</th><td>出场 ${m.apps} 次，进球 ${m.goals} 个，${m.seasons} 个赛季${m.retired != null ? '，' + m.retired + ' 年退役' : ''}</td></tr>
<tr><th>钱</th><td>账面 ${m.money} 万，场边身份 ${m.sideCash} 万，欠 ${m.debt} 万</td></tr>
<tr><th>谈话</th><td>说了 ${m.talk.turns} 句，问出 ${m.talk.dug} 件事，被拦 ${m.talk.blocked} 次，翻脸 ${m.talk.angry} 次，宣称结果被降级 ${m.talk.downgraded} 次</td></tr>
<tr><th>关系</th><td>平均信任 ${m.relation}，编辑信任 ${m.editorial}，许可 ${m.perms} 份</td></tr></table>
<p class="btnrow"><button class="big" id="showbook">读整本 →</button><button id="again">重开 1 段人生</button>${shareBtn()}</p>${regCard()}</div>`;
  }
  function stageBook() {
    const full = game.book();
    return `<div class="card"><h2>《足球之路》 · ${game.state.chapters.length} 章</h2>
<div class="btnrow"><button class="big" id="export-epub">导出 EPUB</button><button id="print-pdf">打印 / 存 PDF</button><button id="export-html">下 HTML</button>${MR.closed ? '' : '<button id="tv-open">交给电视台</button>'}</div>
<div class="btnrow"><button id="export-md">导出 Markdown</button><button id="btn-copy">复制全文</button>${shareBtn()}<button id="toggle-marks">${MR.cfg.stripMarks ? '显示引用标记' : '隐藏引用标记'}</button><button id="backend">回结算</button></div>
<p class="mut">导出都在你这台机器上算，不经过服务器。EPUB 能直接进 Apple Books / KOBO / Calibre；PDF 走打印那 1 页（目标选「另存为 PDF」）。</p>
<div class="book">${esc(full)}</div>${MR.closed ? '' : regCard()}</div>`;
  }

  // ---------------- 导出：字节在这台算，稿子不给任何服务器看 ----------------
  function bookMeta() {
    const st = s(), A = MR.acct || {}, ed = edOf(st.edition);
    let title = '足球之路';
    try { const e = game.endings(); if (e && e.title) title = MR.bookTitle ? MR.bookTitle(e.title) : ('足球之路 · ' + String(e.title).replace(/[\u300a\u300b]/g, '')); } catch (e) { }
    const raw = (A.user && (A.user.handle || A.user.email)) || A.localHandle || '';
    const sm = MR.summary(st) || {};
    return {
      title, author: raw ? String(raw).split('@')[0] : '未署名',
      kicker: '伤停补时', publisher: '伤停补时工作间',
      subtitle: ed.name + ' · ' + st.chapters.length + ' 章 · ' + (sm.styleName || '没定踢法'),
      subject: '足球 · 虚构回忆录',
      rights: '本书全部人名、俱乐部、城市与机构均为虚构',
      file: '足球之路-' + st.seed,
      printNote: '浏览器菜单 → 打印 → 目标选「另存为 PDF」。这一页在你机器上生成，没上传。',
    };
  }
  function doEpub() {
    try {
      const m = bookMeta();
      if (!MR.epubBytes) return toast('缺 export/zip 那两个文件：导不了');
      const b = MR.epubBytes(game.book(), m);
      MR.saveBytes(MR.exportSafeName(m.file) + '.epub', b, 'application/epub+zip');
      toast('EPUB 好了：' + s().chapters.length + ' 章、' + Math.round(b.length / 1024) + ' KB');
    } catch (e) { toast('导不出来：' + String((e && e.message) || e).slice(0, 44)); }
  }
  function doHtml() {
    const m = bookMeta();
    downloadText(MR.exportSafeName(m.file) + '.html', MR.printHtml(game.book(), m), 'text/html;charset=utf-8');
  }
  function doPrint() {
    const html = MR.printHtml(game.book(), bookMeta());
    let w = null;
    try { w = window.open('', '_blank'); } catch (e) { w = null; }
    if (w && w.document) {
      w.document.open(); w.document.write(html); w.document.close();
      setTimeout(() => { try { w.focus(); w.print(); } catch (e) { toast('它没理打印：改下 HTML，用浏览器打开再打印'); } }, 400);
      toast('排好了：在弹出的窗口里选「另存为 PDF」');
    } else {
      toast('弹窗被拦：给你下成 HTML，打开它再打印');
      doHtml();
    }
  }

  // ---------------- 篇幅 / 注册 / 云档（免费：只有存档要注册）----------------
  function edOf(k) { return (MR.EDITIONS || {})[k] || { id: 'mid', name: '平装本', blurb: '' }; }
  function bookCell() {
    const A = MR.acct || {}, ed = edOf(s().edition);
    const who = A.canSave && A.canSave() ? '已建档' : '未建档';
    return ed.name + '·' + who;
  }
  function buildCell() {
    const m = MR.summary(s());
    const holes = (m.holes || []).length ? ' · 短板 ' + m.holes.map((k) => MR.ATTR_LABEL[k]).join('、') : '';
    return (m.styleName || '—') + ' ' + MR.ALLOC.keys.map((k) => s().attrs[k]).join('/') + holes;
  }

  function editionPicker() {
    if (!MR.EDITIONS) return '';
    const cur = game.state.edition || 'mid';
    const btns = Object.keys(MR.EDITIONS).map((k) => {
      const e = MR.EDITIONS[k];
      return `<button class="ed ${cur === k ? 'on' : ''}" data-ed="${k}"><b>${esc(e.name)}</b><i>${esc(e.blurb)}</i></button>`;
    }).join('');
    return `<div class="editions"><h3>篇幅 <i class="mut">周迟问：这本打算写多厚？</i></h3>
<div class="edrow">${btns}</div>
<p class="mut">不收钱。这一选只定 2 件事：能写多少章，和交稿前剩多少天。</p></div>`;
  }
  function setEdition(k) {
    const old = game.state, seed = old.seed;
    game = MR.createGame({ seed, edition: k, alloc: old.alloc || null });
    if (old.playId) game.state.playId = old.playId;
    MR.uiGame = game; game.state.phase = 'roll'; view.book = false; draft = null;
    render();
    toast('篇幅：' + edOf(k).name + ' · 预算 ' + game.state.capTotal + ' 章 · 交稿前 ' + game.state.dayLeft + ' 天');
  }

  // 原来这里是「出版合同 + 扫码付款」。现在这个产品不收钱：那张卡换成「留个名」。
  function regCard() {
    const A = MR.acct || {}, who = A.user || null;
    const nm = (who && (who.handle || who.email)) || A.localHandle || '本机';
    if (A.canSave && A.canSave()) {
      return `<div class="contract ok"><h3>这 1 局归你：<b>${esc(nm)}</b></h3>
<p class="lead">全书 ${s().chapters.length} 章，${esc(edOf(s().edition).name)}。导出、复制、改字，都不收钱。</p>
<p class="btnrow"><button class="big" data-act="epub">导出 EPUB</button><button data-act="print">打印 / 存 PDF</button><button data-act="export">Markdown</button><button data-act="copy">复制全文</button><button data-act="save">存 1 回</button></p>
<p class="mut">换手机、换电脑，在「账户」里登录就能把这局读回来${A.on ? '' : '（现在只有本机登记，接上服务才能跨设备）'}。</p></div>`;
    }
    return `<div class="contract"><h3>书写完了，先留个名</h3>
<p class="lead">周迟把稿子推过来：「${s().chapters.length} 章，我 1 分钱不要。但你明天回来，这稿子就找不着了。」</p>
<p class="btnrow"><button class="big" id="reg-open">注册（只为存档）</button><button data-act="epub">先导成书，不注册</button></p>
<p class="mut">注册只办 2 件事：换设备能接着写；以后电视台上架要认人。全书永远免费。</p></div>`;
  }

  function regBox(why, tab) {
    const A = MR.acct || {};
    const prev = document.getElementById('regmask');
    if (prev) prev.remove();
    const online = !!A.on;
    const lb = localBook();
    let cur = tab || (online ? 'reg' : 'local');
    const el = document.createElement('div');
    el.className = 'paymask'; el.id = 'regmask';
    el.innerHTML = '<div class="pay" id="rg-body"></div>';
    document.body.appendChild(el);
    const kill = () => el.remove();
    const q = (s) => el.querySelector(s);
    const val = (s) => { const x = q(s); return x ? String(x.value || '') : ''; };
    function stat(t) { const x = q('#rg-stat'); if (x) x.textContent = t; }
    function migLine() {
      if (!online || !lb) return '';
      const n = ((lb.obj || {}).chapters || []).length || 0;
      const known = (A.plays || []).some((p) => p.id === lb.id);
      return `<p class="mut">这台浏览器里已经有 ${n} 章：${known ? '云上也有这局，我不碰它' : '建档成功就顺手推上云'}。</p>`;
    }
    function paint(msg) {

    const r = (ch && ch.risk) || { score: 0, kinds: {} };
    return `<div class="narr"><h3>叙述权 <i class="mut">只改写法，不改已经发生的事——引擎会拦</i></h3>

  function lawBlock() {
    const dem = game.demands();
    if (!dem.length) return '';
    const rows = dem.map((d) => {
      const canFoot = (game.state.narr.footnote || 0) > 0;
      const foot = `<button class="tiny${canFoot ? '' : ' off'}" data-dem="${d.chapter}|footnote"${canFoot ? '' : ' disabled title="我没有“加注”了——去经营 1 段关系，或者选另 1 种回信"'}>加注</button>`;
      return `<div class="law ${d.must ? 'must' : ''}"><b>第 ${d.chapter} 章 ${esc(d.title)}</b> 风险 ${d.score}（${d.kinds.join('+') || '—'}）${d.must ? '<i class="mut"> 必须回</i>' : '<i class="mut"> 提醒，可以不管</i>'}
${d.done ? '<i class="ok">已回信：' + esc(d.done) + '</i>' : foot + '<button class="tiny" data-dem="' + d.chapter + '|blur">写模糊</button><button class="tiny" data-dem="' + d.chapter + '|keep">不改，扛着</button>'}</div>`;
    }).join('');
    const sal = MR.sales(game.state);
    return `<div class="laws"><h3>出版社法务回信 <i class="mut">名字 1 个都不许出现；像到 1 定程度要付钱</i></h3>${rows}
<p class="mut">预计 ${sal.copies} 万册（${sal.label}）· 未回 ${sal.unresolved} 封 · 删稿 ${sal.cuts} 条 · 第 ${sal.edition} 版</p></div>`;

      return `<p class="mut">${game.state.year} 年没有 1 个在榜的人——他们要到 ${first} 年才开第 1 场。这本书的前半段，我周围只有大我 10 岁的小孩。</p>`;
    }
    return `<p class="mut">${game.state.year} 年在榜的人。我和其中几个同过队，这就是全部关系。</p>` + list.map((x) => {
      const club = (MR.WORLD.clubs[x.club] || {}).name || '—';
      return `<div class="star ${x.sameClub ? 'same' : ''}"><b>${esc(x.name)}</b> <i class="mut">${esc(x.pos)} · ${club} · ${x.years[0]}–${x.years[1]}</i>

<div class="mut">${esc((x.traits || []).join('、'))}</div>
<div>${esc(x.quote || '')}</div></div>`;

  function on1(id, fn, ev) {

$$('[data-rv]').forEach((b) => b.addEventListener('click', () => {

      catch (e) { toast('没删成：' + String((e && e.message) || e).slice(0, 60)); }
    });
    on('ac-refresh', async () => { try { await MR.acct.me(); await MR.acct.cloudList(); render(); } catch (e) { toast((e.message || '').slice(0, 60)); } });
    $$('[data-restore]').forEach((b) => b.addEventListener('click', async () => {
      try {
        const r = await MR.acct.cloudGet(b.dataset.restore);
        game = MR.createGame({ seed: (r.state && r.state.seed) || 20260824, edition: r.edition });
        game.load(r.state); MR.uiGame = game; view.book = false; draft = null;
        document.body.classList.remove('sheet-open'); render(); toast('接上云端这局了');
      } catch (e) { toast('读不回来：' + (e.message || e)); }
    }));
    on('cfg-apply', () => {
      MR.cfg.mode = $('#cfg-mode').value; MR.cfg.baseUrl = $('#cfg-url').value.trim(); MR.cfg.model = $('#cfg-model').value.trim();
      MR.cfg.key = $('#cfg-key').value.trim(); MR.cfg.temperature = parseFloat($('#cfg-temp').value);
      MR.cfg.stripMarks = $('#cfg-strip').checked; MR.cfg.proxy = $('#cfg-proxy').checked;
      toast(MR.cfg.mode === 'model' ? '已切到远端模型' : '已切到离线模板');
    });
    on('cfg-llm', async () => {
      try {
        const r = await MR.acct.llmStatus();
        if (r.offline) { toast('问不到：这 1 项问的是服务端的路由，得先连上它'); return; }
        const ps = (r.providers || []).map((p) => p.name + (p.state === 'ok' ? '' : '·' + p.state) + (p.coolingMs ? '(' + Math.round(p.coolingMs / 1000) + ' 秒)' : ''));
        llmStatus = { line: ps.join(' → ') || '（服务端 1 条都没配上）', quota: r.quota, dropped: (r.dropped || []).length };
        render();
        if ((r.dropped || []).length) toast(r.dropped[0]);
      } catch (e) { toast('问不到路由：' + (e.message || e)); }
    });
    on('probe-run', () => {
      const txt = $('#probe-in').value;
      let ev = game.event();
      let tk = s().talk;
      if (!ev || !ev.talk) {
        ev = { id: 'test', talk: { who: 'zhou', patience: 3, has: ['那张报纸'], topics: ['那 1 针'], infos: [] }, options: [{ id: 'a', label: '说实话' }, { id: 'b', label: '不接话' }, { id: 'c', label: '把纸给他看' }, { id: 'd', label: '问他要不要署名', typedOnly: true }] };
        tk = MR.newTalk(ev);
      }
      const out = MR.adjudicate(s(), ev, tk, txt);
      $('#probe-out').innerHTML = `<p><b>判定：${out.verdict}</b></p><p class="mut">${esc(out.reason || '')}${out.reply ? '<br>' + esc(out.reply) : ''}${out.hint ? '<br>提示：第 ' + out.hint.n + ' 项「' + esc(out.hint.label) + '」' : ''}</p>`;
    });
    on('val-run', () => {
      const facts = s().facts.filter((f) => f.stance !== 'omit');
      const v = MR.validateChapter('（回忆 · 试写）\n' + $('#val-in').value, facts.length ? facts : [{ id: 'F000', t: '', num: {} }], [], [], s());
      $('#val-out').innerHTML = badge(v) + issueList(v);
    });
    $$('.tabs button').forEach((b) => b.addEventListener('click', () => {
      view.tab = b.dataset.tab; render();
      // 电视台这页的数据在服务端里，点开才去取（不在每 1 次 render 里刷）
      if (view.tab === 'tv' && MR.acct && MR.acct.on && !(view.tv && view.tv.busy)) loadTv(true);
    }));
    $$('#side details summary').forEach(() => { });
    $$('[data-e]').forEach((d) => d.addEventListener('click', () => {
      const ev = (MR.EVENTS || []).find((x) => x.id === d.dataset.e);
      toast(ev ? `${ev.age} 岁 · ${ev.title} · ${((MR.EVENTS || []).indexOf(ev)) < s().evIdx ? '已过' : '还没到'}` : '');
    }));
  }

  function downloadText(name, text, mime) {
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/markdown;charset=utf-8' }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast('拿走了：' + name);
    } catch (e) { toast('下不下来，用“复制全文”吧'); }
  }

  function copy(t) {
    try {
      const ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    } catch (e) { toast('复制不了，长按选中'); }
  }

  async function doChoose(id) {
    const r = game.choose(id);
    if (!r.ok) { toast(r.why); return; }
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

  </script>
</body>
</html>
